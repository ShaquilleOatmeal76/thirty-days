<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Thirty Days: a daily settlement game. One village, thirty days, one decision a day.">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font: 14px system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Thirty Days</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@500;700;800&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Caveat:wght@500;700&display=swap">
<style>
/* Frontier almanac. The village fills the screen; a wooden board on the right (a drawer under the village on phones)
   holds the day's two pinned papers and a wax-seal button. One committed parchment-and-ink look, no dark variant. */
:root {
  --paper: #f1e3c2;      /* almanac paper */
  --paper-2: #e5d1a4;    /* aged edge, wells, rules */
  --wood: #6b4428;       /* the board */
  --wood-dark: #3f2716;
  --ink: #3a2516;        /* brown ink */
  --ink-soft: #77583d;
  --seal: #a3302a;       /* red wax */
  --seal-dark: #6e1c18;
  --brass: #c89632;
  --good: #4f7a26;
  --bad: #a3302a;
  --harmony: #c2456b; --power: #3d6e9c; --wealth: #b07d12; --food: #5d8a2a;
  --sky: #9cc9dc;
  --font-pixel: "Alegreya Sans", "Trebuchet MS", system-ui, sans-serif;
  --font-text: "Alegreya", Georgia, "Times New Roman", serif;
  --font-hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--wood-dark); color: var(--ink); font-family: var(--font-text); font-size: 16px; line-height: 1.4; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
.px { display: block; image-rendering: pixelated; flex: none; }

/* ---------- the screen ---------- */
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 440px; }
.stage { position: relative; overflow: hidden; background: var(--sky); min-height: 0; }
.stage canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: manipulation; }

/* HUD pieces float over the village like scraps of paper */
.hud-top { position: absolute; z-index: 4; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 10px;
  padding: max(12px, env(safe-area-inset-top, 0px)) 12px 0 max(12px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.hud-top > * { pointer-events: auto; }
.tag { background: var(--paper); border: 2px solid var(--ink); box-shadow: 3px 3px 0 rgba(58, 37, 22, .35); }
.brand { display: grid; gap: 3px; padding: 6px 10px 7px; }
.brand .logo { font-family: var(--font-pixel); font-weight: 700; font-size: .9rem; line-height: 1; color: var(--seal); }
.brand .day { display: flex; align-items: baseline; gap: 6px; font-family: var(--font-pixel); line-height: 1; }
.brand .day b { font-size: 1.5rem; font-weight: 700; }
.brand .day span { font-size: .85rem; color: var(--ink-soft); }
.pathline { display: flex; align-items: center; gap: 5px; background: transparent; border: 0; border-top: 1px dashed var(--ink-soft); margin-top: 2px; padding: 4px 0 0; font-family: var(--font-pixel); font-size: .85rem; text-align: left; }
.pathline b { font-weight: 800; color: var(--seal); }
.pathline span { color: var(--ink-soft); }
.pathline .px { width: 16px; height: 16px; }
.note .tracks { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 3px 6px; align-items: center; margin-top: 4px; font-size: .9rem; }
.note .tracks .px { width: 16px; height: 16px; }
.note .tracks i { display: block; height: 6px; background: var(--seal); margin-top: 1px; }
.note .tracks .n { font-family: var(--font-pixel); font-weight: 700; text-align: right; }
.tile .nm .pi { display: inline-block; vertical-align: -2px; margin-left: 4px; opacity: .85; }
.detail .gives { font-size: .85rem; color: var(--ink-soft); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
.detail .gives span { display: inline-flex; align-items: center; gap: 3px; }
.detail .gives .px { width: 14px; height: 14px; }
.brand .day em { font-style: normal; font-size: .8rem; color: var(--seal); margin-left: auto; padding-left: 8px; }
.sq { display: flex; flex-wrap: wrap; gap: 2px; max-width: 220px; }
.sq i { width: 7px; height: 7px; border: 1px solid var(--ink); background: transparent; }
.sq i.best { background: #6aa336; } .sq i.solid { background: #e2b33a; } .sq i.weak { background: var(--seal); } .sq i.now { border-style: dashed; }

.almanac { flex: 1 1 auto; display: flex; justify-content: center; min-width: 0; }
.alm { display: flex; gap: 0; padding: 0; }
.alm button { position: relative; background: transparent; border: 0; border-left: 1px dashed var(--paper-2); padding: 5px 7px 4px; display: grid; justify-items: center; gap: 2px; min-width: 50px; }
.alm button:first-child { border-left: 0; }
.alm button .d { font-family: var(--font-pixel); font-size: .72rem; line-height: 1; color: var(--ink-soft); }
.alm button .c { font-family: var(--font-pixel); font-size: .66rem; line-height: 1; color: var(--ink-soft); }
.alm button .c.sure { color: var(--good); }
.alm button.today { background: var(--paper-2); }
.alm button.today .d { color: var(--seal); font-weight: 700; }
.alm button.fog .px { opacity: .35; }
.alm button[aria-expanded="true"] { box-shadow: inset 0 -3px 0 var(--seal); }
.tools { display: flex; gap: 8px; align-items: flex-start; }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; padding: 0; }
.iconbtn:hover { background: #fff3d6; }
.iconbtn b { font-family: var(--font-pixel); font-size: 1.3rem; line-height: 1; }
.themes { display: flex; height: 44px; }
.themes button { background: transparent; border: 0; padding: 0 9px; font-family: var(--font-pixel); font-size: .8rem; color: var(--ink-soft); }
.themes button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

.hud-bot { position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end;
  padding: 0 12px max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.hud-bot > * { pointer-events: auto; }
.moods { display: flex; padding: 4px 4px 3px; }
.mood { background: transparent; border: 0; padding: 2px 8px; display: grid; justify-items: center; gap: 2px; min-width: 62px; }
.mood + .mood { border-left: 1px dashed var(--paper-2); }
.meter { position: relative; width: 30px; height: 30px; }
.meter .px { position: absolute; left: 0; bottom: 0; width: 30px; height: 30px; }
.meter .fill { position: absolute; left: 0; right: 0; bottom: 0; overflow: hidden; }
.mood .mw { font-family: var(--font-pixel); font-size: .74rem; line-height: 1; white-space: nowrap; }
.mood .mn { font-family: var(--font-pixel); font-weight: 700; font-size: .95rem; line-height: 1; font-variant-numeric: tabular-nums; }
.res { display: flex; gap: 12px; padding: 7px 10px; font-family: var(--font-pixel); font-size: .95rem; font-variant-numeric: tabular-nums; }
.res span { display: inline-flex; align-items: center; gap: 5px; }

.note { position: absolute; z-index: 6; max-width: min(300px, calc(100% - 24px)); padding: 8px 11px; font-size: .95rem; line-height: 1.3; }
.note b { display: block; font-family: var(--font-pixel); font-size: .8rem; color: var(--seal); margin-bottom: 2px; }

.bubble { position: absolute; z-index: 5; width: min(240px, 66%); background: rgba(40, 24, 12, .55); color: #fff8e6; border: 0; padding: 5px 9px; font-size: .92rem; line-height: 1.3; cursor: pointer; text-shadow: 0 1px 2px rgba(0, 0, 0, .9); }
.bubble b { font-family: var(--font-pixel); font-weight: 500; color: var(--who, #ffe08a); } .bubble small { color: #eadcc0; }
.bubble p { margin: 1px 0 0; }
.bubble::after { content: ""; position: absolute; left: calc(var(--tail, 30px) - 5px); bottom: -6px; border: 5px solid transparent; border-top-color: rgba(40, 24, 12, .55); border-bottom: 0; }
.bubble.below::after { bottom: auto; top: -6px; border-top: 0; border-bottom: 5px solid rgba(40, 24, 12, .55); }

/* ---------- the board ---------- */
.panel { background-color: var(--wood); background-image: repeating-linear-gradient(90deg, rgba(0, 0, 0, .07) 0 2px, transparent 2px 23px), repeating-linear-gradient(0deg, rgba(255, 255, 255, .03) 0 1px, transparent 1px 7px);
  border-left: 4px solid var(--wood-dark); overflow-y: auto; display: flex; flex-direction: column; gap: 9px;
  padding: max(10px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) 12px; }
.sheet-paper { position: relative; background: var(--paper); padding: 12px 14px 11px; box-shadow: 0 3px 0 rgba(0, 0, 0, .25); display: grid; gap: 8px; }
.sheet-paper::before, .sheet-paper::after { content: ""; position: absolute; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--brass); box-shadow: inset -1px -1px 0 rgba(0, 0, 0, .35); }
.sheet-paper::before { left: 7px; } .sheet-paper::after { right: 7px; }
.dateline { margin: 0; font-family: var(--font-pixel); font-size: .8rem; color: var(--ink-soft); }
.headline { margin: 0; font-family: var(--font-text); font-weight: 700; font-size: 1.12rem; line-height: 1.2; text-wrap: balance; }
.sect { margin: 2px 0 0; font-family: var(--font-pixel); font-weight: 700; font-size: 1rem; display: flex; align-items: baseline; gap: 8px; border-top: 2px solid var(--ink); padding-top: 7px; }
.sect small { font-family: var(--font-text); font-weight: 400; font-style: italic; font-size: .88rem; color: var(--ink-soft); }
.sheet-paper .sect:first-child { border-top: 0; padding-top: 0; }

.tiles { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 6px; padding-top: 4px; }
@media (max-width: 899px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 480px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile { position: relative; text-align: center; background: #f8edd3; border: 2px solid var(--ink-soft); padding: 5px 3px 4px; min-height: 58px; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; align-items: start; gap: 2px; min-width: 0;
  transition: transform .12s ease-out, box-shadow .12s ease-out; }
.tile > .px { width: 26px; height: 26px; }
.tile .nm { font-weight: 700; font-size: .8rem; line-height: 1.12; align-self: center; hyphens: auto; overflow-wrap: anywhere; }
.tile .pis { display: flex; gap: 2px; min-height: 12px; }
.tile .pis .px { width: 12px; height: 12px; opacity: .8; }
.tile .nm .ar { display: block; font-weight: 400; }
.tile .ar { font-size: .8rem; line-height: 1.2; color: var(--ink-soft); }
.tile:hover:not([aria-disabled="true"]) { border-color: var(--ink); }
.tile[aria-pressed="true"] { border-color: var(--ink); background: #fffaf0; transform: translateY(-3px); box-shadow: 0 4px 0 var(--ink); }
.tile[aria-pressed="true"]::after { content: ""; position: absolute; right: -6px; bottom: -6px; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #c9443c, var(--seal) 60%, var(--seal-dark)); }
.tile[aria-disabled="true"] { opacity: .5; }
.tile.group { border-style: dashed; background: transparent; }
.buildbtn { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; background: transparent; border: 1px dashed var(--ink-soft); padding: 2px 8px 2px 4px; font-family: var(--font-text); font-weight: 700; font-size: .85rem; }
.buildbtn .px { width: 18px; height: 18px; }
.buildbtn small { font-weight: 400; color: var(--ink-soft); }
.buildbtn[aria-expanded="true"] { background: var(--paper-2); border-style: solid; }
.buildbtn[hidden] { display: none; }
.ribbon { position: absolute; top: -9px; right: 3px; font-family: var(--font-pixel); font-size: .66rem; line-height: 1; padding: 3px 4px 5px; color: #fff4dc; background: var(--seal);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 75%, 0 100%); }
.ribbon.new { background: var(--power); }
.ribbon.rare { background: var(--wealth); color: #fff8e6; }
.die { position: absolute; top: -7px; left: -6px; }
.detail { min-height: 4em; font-size: .95rem; line-height: 1.3; border-top: 1px dashed var(--ink-soft); padding-top: 7px; }
.detail p { margin: 0; }
.detail .arw { font-family: var(--font-pixel); font-size: .85rem; color: var(--seal); margin-bottom: 2px; }
.detail .placeholder { color: var(--ink-soft); font-style: italic; }
.detail .dn { font-weight: 700; }
.detail .odds { color: var(--seal); font-size: .88rem; margin-top: 2px; }
.detail .why { color: var(--seal); font-size: .88rem; font-style: italic; }

#dials { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 14px; }
.dial { display: grid; gap: 1px; min-width: 0; align-content: start; }
.dial .nm { display: flex; align-items: center; gap: 6px; font-family: var(--font-pixel); font-size: .9rem; }
.dial .nm .px { width: 18px; height: 18px; }
.lever { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.lever::before { content: ""; position: absolute; left: 16.6%; right: 16.6%; top: 8px; height: 4px; background: var(--wood); border-radius: 2px; }
.lever button { position: relative; background: transparent; border: 0; padding: 0 0 2px; display: grid; justify-items: center; gap: 2px; font-size: .78rem; color: var(--ink-soft); }
.lever button::before { content: ""; width: 10px; height: 10px; margin-top: 5px; margin-bottom: 1px; border-radius: 50%; background: var(--paper); border: 2px solid var(--wood); box-sizing: border-box; }
.lever button[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
.lever button[aria-pressed="true"]::before { width: 18px; height: 18px; margin-top: 1px; margin-bottom: -3px; background: radial-gradient(circle at 35% 30%, #f3d27a, var(--brass) 55%, #7f5b16); border: 2px solid var(--ink); }
.dial .arrows { font-size: .76rem; line-height: 1.15; color: var(--ink-soft); }
.dial .arrows:empty { display: none; }

.seal { position: sticky; bottom: 0; z-index: 2; margin-top: auto; flex: none; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--paper); border: 3px solid var(--ink); padding: 6px 14px 6px 8px; box-shadow: 0 4px 0 var(--ink); }
.seal .wax { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 38% 32%, #cf4a40, var(--seal) 55%, var(--seal-dark)); box-shadow: 0 0 0 3px rgba(163, 48, 42, .35), inset -3px -4px 0 rgba(0, 0, 0, .2); }
.seal .wax .px { width: 28px; height: 28px; }
.seal .st { display: grid; gap: 1px; }
.seal .st b { font-family: var(--font-pixel); font-weight: 700; font-size: 1.35rem; line-height: 1; }
.seal .st small { font-size: .88rem; color: var(--ink-soft); font-style: italic; }
.tester { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: .8rem; color: #e9d7b4; }
.tester span { flex: 1 1 auto; font-style: italic; }
.tester button { background: transparent; border: 1px solid #e9d7b4; color: #f6ead0; padding: 3px 8px; font-size: .8rem; }
.seal:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.seal:disabled { cursor: not-allowed; box-shadow: 0 4px 0 var(--ink-soft); border-color: var(--ink-soft); }
.seal:disabled .wax { background: var(--paper-2); box-shadow: inset 0 0 0 2px var(--ink-soft); }
.seal:disabled .wax .px { opacity: .35; }
.seal:disabled .st b { color: var(--ink-soft); }
body.dusk .panel { pointer-events: none; }
body.dusk .panel .sheet-paper, body.dusk .seal { filter: brightness(.82); }

/* ---------- phone: the village on top, the board slides up under it as a drawer ---------- */
@media (max-width: 899px) {
  body { overflow: auto; }
  html, body { height: auto; }
  .app { display: block; }
  .stage { height: clamp(400px, 64vh, 560px); }
  .brand .logo span { display: none; }
  .panel > .themes { align-self: center; }
  .panel { position: relative; z-index: 5; margin-top: -18px; border-left: 0; border-top: 4px solid var(--wood-dark); border-radius: 14px 14px 0 0; overflow: visible;
    padding: 18px max(14px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); }
  .panel::before { content: ""; position: absolute; top: 6px; left: 50%; width: 46px; height: 5px; margin-left: -23px; border-radius: 3px; background: var(--wood-dark); }
  .hud-bot { padding-bottom: 26px; }
  .seal { position: static; }
  .almanac { order: 3; flex-basis: 100%; justify-content: flex-start; }
  .hud-top { gap: 6px 8px; }
  .brand { padding: 5px 8px 6px; }
  .brand .logo { font-size: .78rem; }
  .brand .day b { font-size: 1.15rem; }
  .iconbtn, .themes { height: 40px; } .iconbtn { width: 40px; }
  .tools { margin-left: auto; }
  .alm button { min-width: 0; padding: 5px 5px 4px; }
  .mood { min-width: 0; padding: 2px 5px; }
  .res { gap: 8px; font-size: .85rem; padding: 6px 8px; }
}
@media (max-width: 420px) {
  .tiles { gap: 6px; }
  .tile > .px { width: 24px; height: 24px; }
  .themes button { padding: 0 6px; font-size: .74rem; }
  .meter, .meter .px { width: 26px; height: 26px; }
}

/* ---------- overlays: the Chronicle and the ledger book ---------- */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(28, 18, 40, .55); overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.overlay[hidden] { display: none; }
.chron { max-width: 700px; margin: 8px auto; background: var(--paper); padding: 16px 20px 18px; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); display: grid; gap: 12px;
  background-image: radial-gradient(ellipse at 20% 0%, rgba(255, 255, 255, .35), transparent 60%), radial-gradient(ellipse at 100% 100%, rgba(140, 100, 40, .16), transparent 55%); }
@media (prefers-reduced-motion: no-preference) { .chron { animation: rise .45s cubic-bezier(.2, .8, .3, 1); } @keyframes rise { from { transform: translateY(60px); opacity: 0; } } }
.mast { text-align: center; border-bottom: 3px double var(--ink); padding-bottom: 6px; display: grid; gap: 3px; }
.mast h3 { margin: 0; font-family: var(--font-pixel); font-weight: 700; font-size: clamp(1.5rem, 5.5vw, 2.3rem); line-height: 1; letter-spacing: .01em; }
.mast p { margin: 0; display: flex; justify-content: space-between; gap: 8px; font-size: .85rem; font-style: italic; color: var(--ink-soft); border-top: 1px solid var(--ink); padding-top: 3px; }
.lead { margin: 0; font-weight: 700; font-size: clamp(1.25rem, 3.6vw, 1.6rem); line-height: 1.15; text-wrap: balance; }
.story.cols { columns: 2 230px; column-gap: 22px; column-rule: 1px solid var(--paper-2); font-size: 1.02rem; line-height: 1.45; }
.story { font-size: 1.02rem; line-height: 1.45; }
.story p { margin: 0 0 6px; }
.story p:first-child::first-letter { font-family: var(--font-pixel); font-weight: 700; float: left; font-size: 2.6em; line-height: .8; padding: 4px 6px 0 0; color: var(--seal); }
.echo { margin: 0; font-style: italic; border-left: 3px solid var(--seal); padding-left: 10px; }
.echo b { font-style: normal; font-family: var(--font-pixel); font-size: .8rem; color: var(--seal); display: block; }
.ccols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 560px) { .ccols { grid-template-columns: minmax(0, 1fr); } }
.box { border: 2px solid var(--ink); padding: 9px 11px; display: grid; gap: 6px; align-content: start; }
.box h4 { margin: 0; font-family: var(--font-pixel); font-weight: 700; font-size: .95rem; }
.box p { margin: 0; }
.bm { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; }
.bm .grade { width: 30px; height: 30px; border: 2px solid var(--ink); }
.bm .grade.best { background: #6aa336; } .bm .grade.solid { background: #e2b33a; } .bm .grade.weak { background: var(--seal); }
.bm .you { color: var(--ink-soft); font-style: italic; font-size: .92rem; }
.shifts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.shift { display: grid; justify-items: center; gap: 1px; text-align: center; font-size: .8rem; line-height: 1.1; }
.shift .px { width: 26px; height: 26px; }
.shift b { font-family: var(--font-pixel); font-size: 1rem; line-height: 1; }
.shift .up { color: var(--good); } .shift .down { color: var(--bad); } .shift .flat { color: var(--ink-soft); }
.counts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--font-pixel); font-size: .9rem; justify-content: center; border-top: 1px dashed var(--ink-soft); padding-top: 6px; }
.counts span { display: inline-flex; gap: 4px; align-items: center; }
.counts .up { color: var(--good); } .counts .down { color: var(--bad); }
.crowd { display: grid; gap: 5px; }

<script>
// ============================================================================
// THIRTY DAYS — rules, story and content (no DOM). The page and tests load this.
//
// THE MODEL (all of this runs in the background; players see words and arrows)
//   Resources are what you HAVE:  Food, Gold, Materials, Settlers.
//   Scores are how you're DOING:  Wealth, Harmony, Power.
//     Wealth  = everything you own (Gold + Materials + buildings)
//     Harmony = built from Food (fed or hungry), your orders, buildings, recent events
//     Power   = built from Settlers (defenders), Militia, walls, recent training
//   Scores feed back: Harmony boosts all output, Power protects your stores.
//   Renown is how the village is KNOWN: six paths, earned by everything you do.
//   Score = Livelihood (Wealth, Harmony, Power added together) + Renown
//     Renown counts your strongest path double, the next once, the rest half.
//   So there's no single right way to play: a peaceful market town and a fortress can both top the board.
// ============================================================================

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const r0 = v => Math.round(v);

const SEASON = { days: 7, start: { food: 60, gold: 40, materials: 20, pop: 12, mood: 0, training: 2 } };

// ---------- Paths: what your village becomes known for ----------
// Add a path by adding it here and tagging content with it (rn: { path: points }).
const TRACKS = {
  trade:   { name: 'Trade',    title: 'Market Hub',     icon: 'coin' },
  might:   { name: 'Might',    title: 'Fortress',       icon: 'shield' },
  haven:   { name: 'Kindness', title: 'Haven',          icon: 'dove' },
  harvest: { name: 'Harvest',  title: 'Breadbasket',    icon: 'wheat' },
  craft:   { name: 'Craft',    title: "Builders' Town", icon: 'hammer' },
  revelry: { name: 'Revelry',  title: 'Festival Town',  icon: 'note' },
  artisan: { name: 'Artistry', title: "Artisans' Quarter", icon: 'vase' },
  shadow:  { name: 'Shadow',   title: "Smugglers' Den", icon: 'mask' },
  faith:   { name: 'Faith',    title: 'Pilgrim Shrine', icon: 'candle' },
  wander:  { name: 'Wanderlust', title: "Explorers' Camp", icon: 'compass' },
  herd:    { name: 'Herding',  title: 'Ranchlands',     icon: 'cow' },
};
// When your second path is close behind your first, the valley gives you a blended name
const COMBO_TITLES = {
  'trade+might': 'Merchant Citadel', 'trade+haven': 'Free City', 'trade+harvest': 'Grain Exchange', 'trade+craft': 'Guild Town', 'trade+revelry': 'Fair Town',
  'trade+artisan': 'Gallery Market', 'trade+shadow': 'Black Bazaar', 'trade+faith': 'Pilgrim Market', 'trade+wander': 'Caravan Crossing', 'trade+herd': 'Cattle Market',
  'might+haven': 'Shield of the Valley', 'might+harvest': 'Garrison Farm', 'might+craft': 'Stone Fortress', 'might+revelry': 'Warriors\' Hall', 'might+artisan': 'Armory',
  'might+shadow': 'Outlaw Keep', 'might+faith': 'Holy Order', 'might+wander': 'Ranger Fort', 'might+herd': 'Cavalry Post',
  'haven+harvest': 'Open Hearth', 'haven+craft': 'Barn Raisers', 'haven+revelry': 'Merry Haven', 'haven+artisan': 'Artists\' Colony', 'haven+shadow': 'Hideaway',
  'haven+faith': 'Sanctuary', 'haven+wander': 'Waystation', 'haven+herd': 'Shepherds\' Rest',
  'harvest+craft': 'Mill Town', 'harvest+revelry': 'Harvest Festival', 'harvest+artisan': 'Garden Town', 'harvest+shadow': 'Moonshine Hollow', 'harvest+faith': 'Blessed Fields',
  'harvest+wander': 'Wild Gardens', 'harvest+herd': 'Homestead',
  'craft+revelry': 'Lantern Town', 'craft+artisan': 'Master Builders', 'craft+shadow': 'Tunnel Town', 'craft+faith': 'Cathedral Town', 'craft+wander': 'Bridgebuilders', 'craft+herd': 'Saddlers\' Town',
  'revelry+artisan': 'Theater Town', 'revelry+shadow': 'Gamblers\' Den', 'revelry+faith': 'Festival of Lights', 'revelry+wander': 'Carnival Road', 'revelry+herd': 'Rodeo Town',
  'artisan+shadow': 'Forgers\' Gallery', 'artisan+faith': 'Abbey', 'artisan+wander': 'Cartographers', 'artisan+herd': 'Weavers\' Valley',
  'shadow+faith': 'Hidden Temple', 'shadow+wander': 'Smugglers\' Road', 'shadow+herd': 'Rustlers\' Gulch',
  'faith+wander': 'Pilgrims\' Road', 'faith+herd': 'Good Shepherd', 'wander+herd': 'Cattle Trail',
};
const TRACK_IDS = Object.keys(TRACKS);
const RENOWN_TITLE_AT = 12;
const blankRenown = () => Object.fromEntries(TRACK_IDS.map(t => [t, 0]));
const renownSorted = rn => TRACK_IDS.map(t => [t, rn[t] || 0]).sort((a, b) => b[1] - a[1]);
// Strongest path ×2, second ×1, the rest ×¼
const RENOWN_REST = 0.25;
function renownScore(rn) { const v = renownSorted(rn).map(x => x[1]); return r0(v[0] * 2 + v[1] + v.slice(2).reduce((a, b) => a + b, 0) * RENOWN_REST); }
// The blended pair when the second path is at least 75% of the first, else null
function comboOf(s) {
  const r = renownSorted(s.renown || {});
  if (r[0][1] < RENOWN_TITLE_AT || r[1][1] < RENOWN_TITLE_AT || r[1][1] < r[0][1] * 0.75) return null;
  const pair = [r[0][0], r[1][0]].sort((a, b) => TRACK_IDS.indexOf(a) - TRACK_IDS.indexOf(b)).join('+');
  return COMBO_TITLES[pair] ? pair : null;
}
function identity(s) { const top = renownSorted(s.renown || {})[0]; return top && top[1] >= RENOWN_TITLE_AT ? top[0] : null; }
// Standing orders and buildings earn a little renown every day

// ---------- Scores (sums of named parts; shown only in the Ledger) ----------
const LIVE_W = { wealth: 6, harmony: 0.8, power: 0.4 };
// Happy neighbors keep an eye out for each other: Harmony 55+ counts as +15 against thieves
const watchOf = (st, power) => power + (st.harmony >= 55 ? 15 : 0);
function eatenPerDay(s, o) { return s.pop * ORDER_FX.table.eat[o.table]; }
function stats(s, o) {
  const eat = eatenPerDay(s, o), days = eat > 0 ? s.food / eat : 9;
  const h = [['Base', 40]];
  if (days >= 3) h.push(['Well fed (3+ days of Food)', 15]);
  else if (days >= 1) h.push(['Food is getting low', 5]);
  else h.push(['Hungry (less than a day of Food)', -15]);
  const hp = (lbl, v) => { if (v) h.push([lbl, v]); };
  hp('Table: ' + DIALS[1].opts[o.table], ORDER_FX.table.harmony[o.table]);
  hp('Work: ' + DIALS[0].opts[o.work], ORDER_FX.work.harmony[o.work]);
  hp('Gates: ' + DIALS[2].opts[o.gates], ORDER_FX.gates.harmony[o.gates]);
  if (has(s, 'tavern')) hp('Tavern', 8);
  if (has(s, 'market')) hp('Market', 3);
  if (has(s, 'hall')) hp('Guest hall', 4);
  if (has(s, 'shrine')) hp('Shrine', 3);
  if (has(s, 'greathall')) hp('Great hall', 6);
  if (s.wonderDone) hp('The great work', 8);
  if ((s.sites || []).includes('springs')) hp('Hot springs', 5);
  hp('Good memories', s.legacy || 0);
  hp('Recent events', r0(s.mood));
  const harmony = clamp(h.reduce((a, [, v]) => a + v, 0), 5, 100);
  const p = [['Settlers as defenders', r0(s.pop * 1.5)]];
  const pp = (lbl, v) => { if (v) p.push([lbl, v]); };
  pp('Guard: ' + DIALS[3].opts[o.guard], ORDER_FX.guard.power[o.guard]);
  if (has(s, 'palisade')) pp('Palisade', 10);
  if (has(s, 'stonewall')) pp('Stone wall', 20);
  pp('Recent training', r0(s.training));
  if (harmony < 30) pp('Low morale', -10);
  const power = clamp(p.reduce((a, [, v]) => a + v, 0), 5, 100);
  const w = [['Gold', s.gold], ['Materials (half value until used)', r0(s.materials * 0.5)], ['Food in store (quarter value)', r0(s.food * 0.25)]];
  if (s.buildings.length) w.push([`Buildings (${s.buildings.length} × ${BUILDING_VALUE})`, s.buildings.length * BUILDING_VALUE]);
  if (s.herd) w.push([`Herd (${s.herd} head × 3)`, s.herd * 3]);
  if (s.wonderDone) w.push(['The great work', 60]);
  const wealth = Math.max(1, w.reduce((a, [, v]) => a + v, 0));
  const output = +(0.7 + harmony * 0.006).toFixed(2);
  // Temporary boosts (recent events, training) count half toward the score, so lasting choices win over time
  const scoreH = clamp(harmony - r0(s.mood) * 0.5, 5, 100), scoreP = clamp(power - r0(s.training) * 0.5, 5, 100);
  // Wealth counts with diminishing returns, so a snowballing economy can't outrun everything else over a month
  const live = (wl, hh, pp) => r0(Math.sqrt(Math.max(0, wl)) * LIVE_W.wealth + hh * LIVE_W.harmony + pp * LIVE_W.power);
  const livelihood = live(wealth, scoreH, scoreP), renown = renownScore(s.renown || {});
  const score = livelihood + renown;
  // Lasting score ignores temporary boosts entirely; the crowd reveal compares on this
  const lasting = live(wealth, clamp(harmony - r0(s.mood), 5, 100), clamp(power - r0(s.training), 5, 100)) + renown;
  return { harmony, harmonyParts: h, power, powerParts: p, wealth, wealthParts: w, output, score, scoreH, scoreP, livelihood, renown, lasting, foodDays: days, identity: identity(s) };
}

function council(s, o) {
  const st = stats(s, o), d = s.day, used = new Set();
  return COUNCIL.filter(r => r.when(s, st, o, d)).sort((a, b) => b.p - a.p)

}

function ensureScript(n) {
  for (let d = 1; d <= n; d++) {
    if (SCRIPT[d]) continue;
    const base = SCRIPT[((d - 1) % 7) + 1], week = Math.floor((d - 1) / 7);
    const day = { ...base, specials: base.specials.slice(), placeholder: true,
      headline: base.event === 'raid' ? 'Riders on the ridge again. More of them this time.' : base.event === 'caravan' ? 'Another caravan rolls in, wagons full.' : FILLER_HEADLINE[base.weather] };
    if (base.raid) day.raid = base.raid + 12 * week;
    const m = MONTH[d] || {};
    Object.assign(day, m); delete day.forecast;
    if (m.event === 'raid' || (base.event === 'raid' && !m.event)) day.specials = (m.specials || base.specials).slice();
    if (m.weather === 'frost' && !m.headline && day.event !== 'raid') day.headline = 'Another freezing morning.';
    if (base.event === 'winter' && m.weather && !m.cold) delete day.event;
    SCRIPT[d] = day;
    const f = FORECAST.find(x => x.day === ((d - 1) % 7) + 1);
    FORECAST.push(m.forecast ? { ...m.forecast, day: d } : day.event === 'raid' ? { kind: 'threat', text: 'Raiders sighted', cert: 'strength unknown', day: d, detail: `Raiders hit on day ${d}, more of them than last time. Fight, pay, hide, parley or deal` }
      : m.weather === 'frost' ? { kind: 'weather', text: 'Freezing', cert: 'certain', day: d, detail: 'A freezing night: food in store and firewood needed' }
      : { ...f, day: d, detail: f.detail.replace(/day \d+/g, 'day ' + d).replace('first winter night', 'cold night') });
  }
  FORECAST.sort((a, b) => a.day - b.day);
}
function setSeasonLength(n) { SEASON.days = n; ensureScript(n); }

  if (day === 12 && s.met.road === 'deal') { c.raidAvoided = true; echo.push('Kestrel remembered your deal on the road. Her riders went around you to hit someone else.'); }
  if (day === 12 && s.met.road === 'cleared') echo.push('Kestrel hasn\'t forgiven you for the road. She brought every rider she has.');
  if (day === 17 && s.met.ashford) { s.food += 15; echo.push('Ashford sent water carts across the bridge, as friends do.'); ledger.push('Ashford pact: +15 Food.'); }
  if (day === 19 && s.met.cass) { c.tempPower += 15; echo.push('Cass sent word in the night: the riders will come through the north gate. Rook was waiting.'); ledger.push('Cass\'s warning: Power +15 for the raid.'); }
  if (day === 20 && s.met.wren) { c.tended = true; echo.push('Sister Wren walked back into the village the morning the fever came, and nursed the sick for free.'); }
  if (W.event === 'rains') { s.mood += 6; }
  if (day === 28) {
    let help = 0;
    if (s.met.ashford) help += 15;
    if (s.met.ashfordAid) help += 15;
    if (help) { c.tempPower += help; echo.push(s.met.ashfordAid ? 'Ashford\'s riders came across the frozen river at dawn. "You fed us," their captain said. "Now we stand with you."' : 'Ashford honoured the pact. Their riders came across the frozen river to stand with you.'); ledger.push(`Ashford's riders: Power +${help} for the warband.`); }

  }

    const paths = TRACK_IDS.filter(t => (s.renown[t] || 0) >= 20); paths.forEach(t => c.rn(t, 6));
    echo.push('Word has spread up and down the frontier: your village faced down Kestrel\'s warband.');
  }

  if (day === 7 && s.met.travelers) { s.materials += 15; s.mood += 6; echo.push('The merchant family you sheltered in the storm came back with a cart of firewood, just in time for the cold.'); ledger.push('Travelers\' gift: +15 Materials, Harmony +6.'); }

  if (W.event === 'raid' && !c.raidAvoided && s.renown.haven >= 25) {

  }

    const g = r0(s.gold * 0.15); s.gold -= g;

    if (c.tended || has(s, 'hospice')) { s.mood -= 2; log.push(has(s, 'hospice') && !c.tended ? 'A fever went round, but the hospice took in everyone who fell ill. Nobody was lost.' : 'The fever passed through, and everyone came out the other side.'); }

  }
  if (W.event === 'winter' || W.cold) {
    const night = day === 7 ? 'The first winter night came' : 'Another freezing night came';
    if (W.cold && !has(s, 'lumberyard')) { const wood = Math.ceil(s.pop * 0.4); if (s.materials >= wood) { s.materials -= wood; ledger.push(`Firewood: −${wood} Materials.`); } else { s.mood -= 6; log.push('There wasn\'t enough firewood to go round. Houses went cold.'); } }

}

// ---------- The simulated crowd ----------
const BOT_FIRST = ['Ash', 'Bram', 'Cora', 'Dell', 'Edda', 'Finn', 'Greta', 'Hale', 'Ines', 'Jory', 'Kit', 'Lark', 'Moss', 'Nell', 'Orrin', 'Pip', 'Quill', 'Rue', 'Sable', 'Tamsin', 'Ulla', 'Vale', 'Wren', 'Yara'];
const BOT_PLACE = ['hollow', 'ford', 'stead', 'wick', 'mere', 'ridge', 'haven', 'brook', 'fell', 'gate'];
// How a village leaning toward each path tends to set its dials
const PATH_DIALS = {
  trade:   { work: 2, table: 1, gates: 1, guard: 1 },
  might:   { work: 1, table: 1, gates: 2, guard: 2 },
  haven:   { work: 1, table: 1, gates: 0, guard: 0 },
  harvest: { work: 1, table: 0, gates: 1, guard: 1 },
  craft:   { work: 2, table: 1, gates: 1, guard: 1 },
  revelry: { work: 0, table: 2, gates: 1, guard: 1 },
  artisan: { work: 1, table: 1, gates: 1, guard: 1 },
  shadow:  { work: 2, table: 1, gates: 2, guard: 0 },
  faith:   { work: 0, table: 1, gates: 0, guard: 1 },
  wander:  { work: 1, table: 1, gates: 1, guard: 1 },
  herd:    { work: 1, table: 0, gates: 1, guard: 1 },

function makeCrowd(n, seed) {
  const rng = mulberry32(seed);
  const pick = a => a[Math.floor(rng() * a.length)];

    // Every bot has a personality: a path it leans toward, and dials that mostly match it
    const path = TRACK_IDS[Math.floor(rng() * TRACK_IDS.length)], o = {};
    DIALS.forEach(d => { const x = rng(); o[d.id] = x < 0.6 ? PATH_DIALS[path][d.id] : x < 0.75 ? 0 : x < 0.9 ? 1 : 2; });

  const opts = focusOptions(bot.s, bot.s.day, bot.orders).filter(x => x.ok);
  const w = opts.map(({ f }) => {
    let v = 1;
    if (f.kind === 'special' || f.special) v += 1.5 * bot.skill + 0.5;
    if (f.kind === 'build') v += 1.2 * bot.skill;
    if (f.kind === 'gamble') v += 0.4;
    if (f.id === 'scout' && bot.s.day <= 4) v += bot.skill;
    if (f.id === 'drill' && bot.s.day === 4) v += 2 * bot.skill;

// ---------- The best move ----------
// Tries every available Focus from the village's real state, plays the rest of the season out
// several times, and ranks the options by where the village ends up. Same seeds for every option,
// so differences come from the choice, not luck.
// Looks HORIZON days ahead (not to the season's end) so it stays quick over a 30-day month.
const HORIZON = 5;

  const opts = focusOptions(s, s.day, orders).filter(x => x.ok).map(x => x.f.id);

function icon(name, size = 24, opts = {}) {
  const rows = BITMAPS[name] || BITMAPS.fog, w = Math.max(...rows.map(r => r.length)), h = rows.length;
  let rects = '';

    let x = 0;

      const ch = row[x]; if (ch === '.' || !IPAL[ch]) { x++; continue; }
      let e = x; while (e < row.length && row[e] === ch) e++;

      rects += `<rect x="${x}" y="${y}" width="${e - x}" height="1" fill="${fill}"/>`;
      x = e;
    }
  });
  const pw = Math.max(w, h);
  return `<svg class="px${opts.cls ? ' ' + opts.cls : ''}" width="${size}" height="${size}" viewBox="${-(pw - w) / 2} ${-(pw - h) / 2} ${pw} ${pw}" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
}

}

let scene = { key: '', statics: [] }, actors = [], cast = {}, riders = [], clouds = [], birds = [], lastT = 0, animOn = true;

function randomTile(area) {
  if (area && AREAS[area]) { const a = AREAS[area]; const [gx, gy] = a[Math.floor(Math.random() * a.length)]; return [gx + (Math.random() - .5) * .8, gy + (Math.random() - .5) * .8]; }
  for (let k = 0; k < 20; k++) { const gx = 1 + Math.floor(Math.random() * 9), gy = 1 + Math.floor(Math.random() * 9), key = gx + ',' + gy; if (freeTile(gx, gy) && (ROAD.has(key) || PLAZA.has(key) || Math.random() < .35)) return [gx + (Math.random() - .5) * .5, gy + (Math.random() - .5) * .5]; }
  return [MID, MID];
}
function syncActors(re = true) {
  const want = Math.max(3, Math.min(8, Math.round(G.s.pop / 3)));
  while (actors.length < want) {
    const [x, y] = randomTile(), i = actors.length;
    actors.push({ x, y, tx: x, ty: y, wait: Math.random() * 2, speed: .6 + Math.random() * .4, look: i, bob: Math.random() * 6,
      name: FOLK_FIRST[(i * 7 + 3) % FOLK_FIRST.length], role: FOLK_ROLE[(i * 5 + 1) % FOLK_ROLE.length], line: (i * 11 + 4) % ODD.length });
  }
  actors.length = want;
  Object.keys(CAST_LOOK).forEach(id => { if (!cast[id]) { const [hx, hy] = CAST_LOOK[id].home; cast[id] = { id, x: hx, y: hy, tx: hx, ty: hy, wait: Math.random() * 3, speed: .55, bob: 0 }; } });
  if (re) retarget();
}
function retarget(all) {

  actors.forEach((a, i) => { a.task = area && (all || i % 5 !== 4) ? area : null; a.wait = Math.random() * .5; if (all) { a.speed = 1.3; [a.tx, a.ty] = randomTile(area || 'plaza'); } else a.speed = .6 + (i % 5) * .08; });

function stepWalker(a, dt, home, radius) {

function frame(now) {

function paint(t) {
  const s = G.s, P = PAL[theme], sea = TH().sea;

  }

    if (weather === 'frost' && hash(gx * 3, gy * 5) > .6) { px(cx - 4, cy - 1, 2, 1, '#ffffff'); px(cx + 3, cy + 1, 1, 1, '#e8f4ff'); }

  } }));
  riders.forEach((r, i) => items.push({ gx: MID + Math.cos(r.a) * r.r, gy: MID + Math.sin(r.a) * r.r, z: .3, draw: (cx, cy) => rider(cx, cy, t, i) }));

}

// sprites
function hut(cx, cy, P, i, t) {
  cube(cx, cy + 1, 8, 7, P.wallT, P.wallL, P.wallR); roof(cx, cy - 6, 9, P.roof1, P.roof2);
  px(cx - 4, cy, 2, 3, '#3a2412'); px(cx + 3, cy - 3, 2, 2, i % 2 ? '#ffe08a' : '#6b4a2a'); glows.push([cx + 3, cy - 3]);
  if (i % 3 === 0) { px(cx + 4, cy - 12, 2, 4, '#7d6a5a'); for (let k = 0; k < 3; k++) { const ph = (t * .6 + k / 3 + i * .17) % 1; px(cx + 4 + Math.sin(ph * 6 + i) * 2, cy - 14 - ph * 14, 2, 2, `rgba(220,220,230,${.55 * (1 - ph)})`); } }
}
function boat(cx, cy, seed, t) { const b = Math.round(Math.sin(t * 2 + seed) * 1); cube(cx, cy + 2 + b, 7, 3, '#8a5a2f', '#5e3a1c', '#76482a'); px(cx, cy - 12 + b, 1, 13, '#4a3020'); for (let k = 0; k < 9; k++) px(cx + 1, cy - 12 + k + b, 6 - (k >> 1), 1, seed % 2 ? '#f4ecda' : '#e9d3a8'); }

function hall(cx, cy, P) { cube(cx, cy + 1, 11, 8, P.wallT, P.wallL, P.wallR); roof(cx, cy - 7, 12, '#5d7f3a', '#6f9447'); px(cx - 2, cy - 1, 3, 4, '#3a2412'); px(cx + 5, cy - 4, 2, 2, '#ffe08a'); glows.push([cx + 5, cy - 4]); px(cx - 8, cy - 3, 2, 2, '#ffe08a'); }
function workshop(cx, cy, t) { cube(cx, cy + 1, 8, 7, '#d9b98a', '#9a6a3e', '#b4824f'); roof(cx, cy - 6, 9, '#6d7780', '#8a949c'); px(cx + 5, cy - 14, 3, 6, '#7d6a5a'); const g = Math.sin(t * 6) > 0 ? '#ff9a3c' : '#ffd36b'; px(cx + 5, cy - 15, 3, 1, g); glows.push([cx + 2, cy - 2]); px(cx + 2, cy - 2, 2, 2, '#ffb15e'); }

function cellar(cx, cy) { cube(cx, cy + 1, 6, 5, '#7a5a3a', '#4e3622', '#644630'); px(cx - 3, cy + 2, 6, 3, '#3a2412'); px(cx - 2, cy + 3, 4, 1, '#5e3a1c'); }
function pasture(cx, cy, P, t, i, herd) {
  diamond(cx, cy, HW, HH, '#7fbf5f'); for (let k = -HW + 1; k < HW; k += 3) { px(cx + k, cy - HH + Math.abs(k) / 2 - 3, 1, 3, '#8a6a45'); }
  const cows = Math.min(4, Math.max(0, Math.ceil(herd / 6) - i * 4));
  for (let k = 0; k < cows; k++) { const x = cx - 7 + k * 5 + Math.round(Math.sin(t * .5 + k + i) * 1.5), y = cy - 1 + (k % 2) * 3; px(x, y - 3, 5, 3, '#f4ecda'); px(x + 1, y - 3, 2, 1, '#3a2516'); px(x + 4, y - 4, 2, 2, '#f4ecda'); px(x, y, 1, 1, '#3a2516'); px(x + 3, y, 1, 1, '#3a2516'); }

function statue(cx, cy, wonder, done, sea) {
  const h = Math.max(3, Math.round(16 * Math.min(100, wonder) / 100)), stone = done ? '#e8e2d4' : '#cfc6b4';
  cube(cx, cy + 1, 5, 3, '#b8ad98', '#8f8676', '#a39a88');
  px(cx - 2, cy - 2 - h, 4, h, stone); px(cx - 1, cy - 5 - h, 3, 3, stone); if (h > 10) { px(cx - 5, cy - h + 2, 3, 2, stone); px(cx + 2, cy - h + 1, 3, 2, stone); }

const PATH_COLOR = { trade: '#e8b830', might: '#4f86b8', haven: '#d9607f', harvest: '#5f9a35', craft: '#8a5a2f', revelry: '#b04fb3', shadow: '#3a2516', faith: '#f4ecda', wander: '#2f8a7a', herd: '#c4473a' };

function ledgerHistory() {
  const H = Object.values(G.hist).sort((a, b) => a.day - b.day);
  if (!H.length) return `<p class="lnote">Your score history starts after you end day 1.</p>`;
  const W = 600, Ht = 180, L = 44, Rm = 16, T0 = 16, B = 26;
  const days = SEASON.days, maxV = Math.max(...H.map(h => Math.max(h.ranked, h.median, h.prev)), 10);
  const step = maxV > 800 ? 200 : maxV > 400 ? 100 : 50, top = Math.ceil(maxV / step) * step;
  const X = d => L + d / days * (W - L - Rm), Y = v => T0 + (1 - v / top) * (Ht - T0 - B);
  const pts = arr => arr.map(([d, v]) => `${X(d).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const d0 = H[0].day - 1, you = [[d0, H[0].prev], ...H.map(h => [h.day, h.ranked])], med = [[d0, H[0].medianStart], ...H.map(h => [h.day, h.median])];

  const ev = evaluateDay(G.s, G.orders);

  retarget(true);
  const b = r.before, a = r.after;
  const ch = [['heart', a.harmony - b.harmony], ['shield', a.power - b.power], ['pouch', a.wealth - b.wealth], ['sack', a.foodDays - b.foodDays]].filter(([, v]) => Math.abs(v) >= 1);

// ---------------------------------------------------------------------------
// Seasons, saving and the daily clock
//   Free pacing (default while we build): play the month at your own speed, one day after another.
//   Daily pacing (the real game, #daily to try it): the season is the calendar month, one day unlocks
//   per real day, missed days run on your standing orders, and late joiners start at the median village.
// ---------------------------------------------------------------------------
const PACING = /(^|#)daily\b/.test(location.hash) ? 'daily' : 'free';
const FREE_SEASON_DAYS = 30;
const SAVE_KEY = 'thirtydays-save-v2';
let replaying = false, dayOffset = 0;
try { dayOffset = +localStorage.getItem('thirtydays-day-offset') || 0; } catch (e) { dayOffset = 0; }

const nowDate = () => new Date(Date.now() + dayOffset * 864e5);
function calendarSeason() {
  const d = nowDate(), y = d.getFullYear(), m = d.getMonth() + 1;
  return { key: `${y}-${String(m).padStart(2, '0')}`, seed: y * 100 + m, days: new Date(y, m, 0).getDate(), today: d.getDate() };
}
// Which day the clock allows you to play up to
const todayLimit = () => PACING === 'daily' ? calendarSeason().today : Infinity;

const medianOf = () => { const v = G.crowd.map(b => b.s.ranked).sort((x, y) => x - y); return v[Math.floor(v.length / 2)]; };
const cloneSt = s => JSON.parse(JSON.stringify(s));

function freshState(seed) {
  return { seed, s: newSettlement(DEFAULT_ORDERS), orders: { ...DEFAULT_ORDERS }, morning: { ...DEFAULT_ORDERS }, choice: null, crowd: makeCrowd(400, seed),
    picksByDay: {}, grades: {}, hist: {}, results: [], playerRng: mulberry32(seed * 7919 + 13), log: [], joinDay: 1 };
}
// A player who arrives mid-month takes over the median village of everyone already playing
function joinAt(day) {
  for (let d = 1; d < day; d++) stepCrowd(G.crowd);
  const v = G.crowd.slice().sort((a, b) => a.s.ranked - b.s.ranked), mid = v[Math.floor(v.length / 2)];
  G.s = cloneSt(mid.s); G.s.history = []; G.orders = { ...mid.orders }; G.morning = { ...mid.orders }; G.joinDay = day;
}

// One day passes. Used for real play, for replaying a saved game, and for missed days.
function advanceDay(focusId, gradeInfo) {
  const day = G.s.day;
  if (gradeInfo) G.grades[day] = gradeInfo;
  const r = resolveDay(G.s, G.orders, focusId, G.playerRng);
  const medianStart = medianOf();
  G.picksByDay[day] = stepCrowd(G.crowd);
  G.hist[day] = { day, focus: focusId, grade: gradeInfo ? gradeInfo.grade : null, prev: r.before.ranked, ranked: r.s.ranked, median: medianOf(), medianStart: day === G.joinDay ? medianStart : (G.hist[day - 1] || {}).median || medianStart };
  G.results.push({ day, flow: r.flow, net: r.net });
  G.s = r.s;
  G.morning = { ...G.orders };
  G.log.push({ day, focus: focusId, orders: { ...G.orders }, grade: gradeInfo || null });
  if (!replaying) saveGame();
  return r;
}

function saveGame() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 2, pacing: PACING, season: G.seasonKey, seed: G.seed, days: G.days, joinDay: G.joinDay, theme, orders: G.orders, log: G.log })); } catch (e) { /* storage unavailable: the game still plays, it just won't resume */ }
}
function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { return null; } }

function startSeason(fresh) {
  const cal = calendarSeason();
  const want = PACING === 'daily' ? { key: cal.key, seed: cal.seed, days: cal.days } : { key: 'free', seed: 20261023, days: FREE_SEASON_DAYS };
  const save = fresh ? null : loadSave();
  const usable = save && save.v === 2 && save.pacing === PACING && save.season === want.key;
  const seed = usable ? save.seed : (fresh && PACING === 'free' && G ? G.seed + 1 : want.seed);
  setSeasonLength(usable ? save.days : want.days);
  G = freshState(seed); G.seasonKey = want.key; G.days = SEASON.days;
  if (usable && save.theme && THEMES[save.theme]) setTheme(save.theme, true);
  const join = usable ? save.joinDay : (PACING === 'daily' ? Math.min(cal.today, SEASON.days) : 1);
  if (join > 1) joinAt(join);
  // Replay what already happened, quickly and quietly
  replaying = true;
  if (usable) save.log.forEach(e => { G.orders = { ...e.orders }; advanceDay(e.focus, e.grade); });
  if (usable && save.orders) G.orders = { ...save.orders };
  // Missed days run on standing orders
  const missed = [];
  while (PACING === 'daily' && G.s.day < Math.min(todayLimit(), SEASON.days + 1) && G.s.day <= SEASON.days) missed.push(advanceDay(null, null));
  replaying = false;
  saveGame();
  lastVoiceKey = ''; lastChoice = undefined;
  render();
  if (missed.length) showCatchUp(missed);
}
