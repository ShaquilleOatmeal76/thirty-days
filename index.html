const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => n.toLocaleString('en-US');

function rankInfo(s) {
  const all = G.crowd.map(b => b.s.ranked);
  const better = all.filter(v => v > s.ranked).length;
  const total = all.length + 1;
  return { rank: better + 1, total, top: Math.max(1, Math.round((better + 1) / total * 100)) };
}
const pips = (v, max, color) => { const n = Math.max(1, Math.min(10, Math.round(v / max * 10))); return Array.from({ length: 10 }, (_, i) => `<i style="${i < n ? `background:${color}` : ''}"></i>`).join(''); };
function moodWhy(kind, st, s) {
  // One plain sentence on the biggest reason, from the hidden parts
  const parts = kind === 'harmony' ? st.harmonyParts.slice(1) : st.powerParts;
  const big = parts.slice().sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).at(0);
  if (!big) return '';
  const lbl = big[0].replace(/\s*\(.*\)/, '');
  return (big[1] >= 0 ? 'Helped most by: ' : 'Held back by: ') + lbl.toLowerCase();
}

let buildOpen = false, voiceAll = false;
const ORDER_WORDS = { work: ['Easy work', 'Steady work', 'Hard work'], table: ['Lean table', 'Normal table', 'Feasts'], gates: ['Open gates', 'Watched gates', 'Shut gates'], guard: ['No guard', 'Patrols', 'Garrison'] };
const SQ = { best: '🟩', solid: '🟨', weak: '🟥' };
const gridLine = () => Array.from({ length: SEASON.days }, (_, i) => G.grades[i + 1] ? SQ[G.grades[i + 1].grade] : '⬛').join('');

function render() {
  const s = G.s, day = Math.min(s.day, SEASON.days), R = TH().res;
  // Everything on screen reflects how the day started; dial changes only show up after you end the day
  const st = stats(s, G.morning), ri = rankInfo(s);
  $('seasonName').textContent = TH().season + ' · 7-day prototype';
  $('dayNum').textContent = 'DAY ' + day;
  $('dayOf').textContent = `OF ${SEASON.days} · TOP ${ri.top}%`;
  $('grid').textContent = gridLine();
  drawDiorama();
  $('hud').innerHTML = `<span>🪙 ${R.gold} <b>${fmt(s.gold)}</b></span><span>🪵 ${R.materials} <b>${fmt(s.materials)}</b></span><span>👥 ${R.pop} <b>${s.pop}</b></span><span class="sep"></span><span>🏗 ${s.buildings.length ? s.buildings.map(bName).join(', ') : 'No buildings yet'}</span>`;

  // Moods: one word each; the reason is a tooltip
  $('moods').innerHTML = [
    [T('Harmony'), MOODS.harmony(st.harmony), 'var(--harmony)', st.harmony, 100, moodWhy('harmony', st, s)],
    [T('Power'), MOODS.power(st.power), 'var(--power)', st.power, 100, moodWhy('power', st, s)],
    [T('Wealth'), MOODS.wealth(st.wealth), 'var(--gold)', st.wealth, 400, 'Your treasury, stores and buildings'],
    [R.food, MOODS.food(st.foodDays), 'var(--good)', Math.min(st.foodDays, 8), 8, st.foodDays >= 1 ? `About ${Math.floor(st.foodDays)} days left` : 'Less than a day left'],
  ].map(([l, w, c, v, max, why]) => `<div class="mood" title="${esc(T(why))}"><span class="lbl">${esc(l.toUpperCase())}</span><span class="word" style="color:${c}">${esc(T(w))}</span><span class="pips">${pips(v, max, c)}</span></div>`).join('');

  // One voice from the council (the most urgent); the rest on request
  const voices = council(s, G.morning);
  const shown = voiceAll ? voices : voices.slice(0, 1);
  $('council').innerHTML = shown.map((c, i) => `<span class="face" aria-hidden="true">${c.face}</span><p><b>${esc(c.name)}:</b> ${esc(T(c.line))}${i === shown.length - 1 && voices.length > 1 ? ` <button class="more" id="voiceMore">${voiceAll ? 'Less' : `+${voices.length - 1} more`}</button>` : ''}</p>`).join('');
  if ($('voiceMore')) $('voiceMore').onclick = () => { voiceAll = !voiceAll; render(); };

  // Coming up: a strip of short chips
  const horizon = Math.max(day + 2, s.scoutedUntil);
  const icons = { weather: '🌦', market: '📈', threat: '⚔️', opportunity: '✨' };
  $('board').innerHTML = FORECAST.filter(f => f.day >= day && f.day <= horizon).map(f => {
    const known = f.day === day || f.day <= s.scoutedUntil;
    const label = f.day === day ? 'TODAY' : f.day === day + 1 ? 'TOMORROW' : 'DAY ' + f.day;
    return `<div class="chipday${f.day === day ? ' today' : ''}" title="${esc(T(known ? f.detail : f.text))}"><span class="d">${label} ${icons[f.kind]}</span><span class="t">${esc(T(known ? f.detail : f.text))}</span><span class="c${known ? ' sure' : ''}">${known ? 'certain' : esc(f.cert)}</span></div>`;
  }).join('');

  // Headline + orders summary (dials open on request)
  $('headline').textContent = TH().headlines[day] || T(SCRIPT[day].headline);
  $('ordersSummary').textContent = DIALS.map(d => ORDER_WORDS[d.id][G.orders[d.id]]).join(' · ');
  $('dials').innerHTML = DIALS.map(d => `<div class="dial"><div class="nm"><span>${esc(dialName(d))}</span></div>
    <div class="seg" role="group" aria-label="${esc(dialName(d))}">${d.opts.map((o, i) => `<button id="dial-${d.id}-${i}" data-dial="${d.id}" data-i="${i}" aria-pressed="${G.orders[d.id] === i}">${o}</button>`).join('')}</div>
    <span class="arrows">${esc(T(d.arrows[G.orders[d.id]]))}</span></div>`).join('');
  $('dials').querySelectorAll('[data-dial]').forEach(b => b.onclick = () => { G.orders[b.dataset.dial] = +b.dataset.i; render(); });

  // Focus tiles: name + arrows only; builds folded into one tile
  const opts = focusOptions(s, day, G.morning);
  const order = { special: 0, gamble: 1, unlock: 2, core: 3, build: 4 };
  opts.sort((a, b) => (order[a.f.special ? 'special' : a.f.kind] - order[b.f.special ? 'special' : b.f.kind]));
  const builds = opts.filter(o => o.f.kind === 'build'), rest = opts.filter(o => o.f.kind !== 'build');
  if (G.choice && FOCUS_BY_ID[G.choice] && FOCUS_BY_ID[G.choice].kind === 'build') buildOpen = true;
  const tile = ({ f, ok }) => {
    const flag = f.kind === 'gamble' ? (f.special ? 'TODAY 🎲' : '🎲') : f.kind === 'special' ? 'TODAY' : f.kind === 'unlock' ? 'NEW' : '';
    const cls = f.kind === 'gamble' ? 'gamble' : f.kind === 'special' ? 'special' : f.kind === 'unlock' ? 'unlock' : '';
    return `<button class="tile" id="focus-${f.id}" data-f="${f.id}" aria-pressed="${G.choice === f.id}" ${ok ? '' : 'aria-disabled="true"'}>
      ${flag ? `<span class="flag ${cls}">${flag}</span>` : ''}
      <span class="nm">${f.emoji} ${esc(focusName(f).replace(/^Build: /, ''))}</span>
      <span class="ar">${esc(T(f.arrows.replace(/^Materials ↓ · Gold ↓ · /, '')))}</span></button>`;
  };
  const affordable = builds.filter(b => b.ok).length;
  $('cards').innerHTML = rest.map(tile).join('') +
    (builds.length ? `<button class="tile group" id="buildGroup" aria-expanded="${buildOpen}"><span class="nm">🔨 Build something</span><span class="ar">${affordable ? `${affordable} you can afford` : 'Nothing affordable yet'} · ${buildOpen ? 'hide' : 'show'}</span></button>` : '') +
    (buildOpen ? builds.map(tile).join('') : '');
  $('cards').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { G.choice = b.dataset.f; render(); });
  if ($('buildGroup')) $('buildGroup').onclick = () => { buildOpen = !buildOpen; render(); };

  // The detail line for the chosen tile
  const sel = G.choice && opts.find(o => o.f.id === G.choice);
  if (sel) {
    const f = sel.f, cost = f.cost ? ` Costs ${f.cost.materials} ${R.materials} and ${f.cost.gold} ${R.gold}.` : '';
    $('detail').innerHTML = `<p><span class="dn">${f.emoji} ${esc(focusName(f))}.</span> ${esc(T(f.story + cost))}</p>${f.odds ? `<p class="odds">🎲 ${esc(T(f.odds))}</p>` : ''}${sel.ok ? '' : `<p class="why">${esc(T(sel.why))}</p>`}`;
  } else $('detail').innerHTML = '<p class="placeholder">Pick a Focus for today. Your orders run everything else.</p>';
  $('endDay').disabled = !sel || !sel.ok || s.day > SEASON.days;
  $('endDay').textContent = day === SEASON.days ? 'End the season' : 'End day ' + day;

  renderLedger(st, opts);
}

function renderLedger(st, opts) {
  const s = G.s, ri = rankInfo(s);
  const parts = list => `<ul class="parts">${list.map(([l, v], i) => `<li><span>${esc(T(l))}</span><b class="${v > 0 ? 'up' : v < 0 ? 'down' : ''}">${v > 0 && i > 0 ? '+' : ''}${fmt(v)}</b></li>`).join('')}</ul>`;
  $('scores').innerHTML = [
    ['Wealth', st.wealth, 'var(--gold)', Math.min(100, st.wealth / 6), 'Everything you own', st.wealthParts],
    ['Harmony', st.harmony, 'var(--harmony)', st.harmony, `Output ×${st.output.toFixed(2)}`, st.harmonyParts],
    ['Power', st.power, 'var(--power)', st.power, st.power < 25 ? 'Under 25: thieves take Gold daily' : 'Protects your stores', st.powerParts],
  ].map(([l, v, c, w, sub, pl]) => `<div class="score"><span class="lbl">${T(l).toUpperCase()}</span><span class="val" style="color:${c}">${fmt(v)}</span><span class="bar"><i style="width:${w}%;background:${c}"></i></span><span class="sub">${esc(T(sub))}</span>${parts(pl)}</div>`).join('') +
    `<div class="score total"><span class="lbl">SCORE · RANK</span><span class="val">${fmt(s.ranked)}</span><span class="sub">#${ri.rank} of ${ri.total} · top ${ri.top}%</span><ul class="parts"><li><span>${esc(T('Wealth'))} × ${esc(T('Harmony'))} × ${esc(T('Power'))} ÷ 1000</span></li><li><span>As of this morning</span><b>${fmt(st.score)}</b></li><li><span>Temporary boosts count half toward the score</span></li><li><span>Ranked score moves at most −25% / +35% a day</span></li></ul></div>`;
  $('explain').innerHTML = T(`<b>How it fits together:</b> resources feed the three scores. Food keeps Harmony up, and Harmony makes everyone work harder. Gold, buildings and your stores are Wealth. Settlers and the militia are Power, and Power protects what you own. Recent events and training are temporary, so they count half toward your score.`);
  $('ledgerDials').innerHTML = `<h4>Standing orders, exactly</h4><ul>${DIALS.map(d => `<li>${esc(dialName(d))} · ${d.opts[G.orders[d.id]]}: ${esc(T(d.hint[G.orders[d.id]]))}</li>`).join('')}</ul>`;
  $('ledgerFocus').innerHTML = `<h4>Today's Focus options, exactly</h4><ul>${opts.map(({ f }) => `<li>${esc(focusName(f))}: ${esc(T(f.fx))}</li>`).join('')}</ul>`;
}

// ---------------------------------------------------------------------------
// Ending a day
// ---------------------------------------------------------------------------
function endDay() {
  if (!G.choice) return;
  const day = G.s.day;
  const ev = evaluateDay(G.s, G.orders);
  G.grades[day] = { grade: gradePick(ev, G.choice), best: ev.best, runnerUp: ev.ranked.length > 1 ? ev.ranked[1][0] : null };
  const r = resolveDay(G.s, G.orders, G.choice, G.playerRng);
  G.picksByDay[day] = stepCrowd(G.crowd);
  G.s = r.s;
  G.morning = { ...G.orders };
  const picked = G.choice;
  G.choice = null;
  render();
  showResults(day, picked, r);
}

function showResults(day, picked, r) {
  const s = G.s, b = r.before, a = r.after, R = TH().res;
  const shift = (label, fn, x, y) => { const p = fn(x), q = fn(y); return p === q ? '' : `<span class="shift ${y > x ? 'up' : 'down'}">${esc(label)}: ${esc(T(p))} → ${esc(T(q))}</span>`; };
  const count = (label, x, y) => { const v = y - x; return v === 0 ? '' : `<span class="shift ${v > 0 ? 'up' : 'down'}">${esc(label)} ${v > 0 ? '+' : ''}${v}</span>`; };
  const shifts = shift(T('Harmony'), MOODS.harmony, b.harmony, a.harmony) + shift(T('Power'), MOODS.power, b.power, a.power) + shift(T('Wealth'), MOODS.wealth, b.wealth, a.wealth) + shift(R.food, MOODS.food, b.foodDays, a.foodDays) + count(R.gold, b.gold, a.gold) + count(R.materials, b.materials, a.materials) + count(R.pop, b.pop, a.pop);
  const picks = G.picksByDay[day];
  const total = Object.values(picks).reduce((acc, v) => acc + v.n, 0);
  const rows = Object.entries(picks).sort((x, y) => y[1].n - x[1].n);
  const top = rows.slice(0, 3);
  if (!top.some(([id]) => id === picked) && picks[picked]) top.push(rows.find(([id]) => id === picked));
  const best = rows.filter(([, v]) => v.n >= 12).sort((x, y) => y[1].gain / y[1].n - x[1].gain / x[1].n).at(0);
  const myGain = (s.ranked - b.ranked) / Math.max(1, b.ranked);
  const pctMine = picks[picked] ? Math.round(picks[picked].n / total * 100) : 0;
  const crowdHtml = top.map(([id, v]) => {
    const p = Math.round(v.n / total * 100), g = v.gain / v.n * 100;
    return `<div class="cbar${id === picked ? ' mine' : ''}"><span class="n">${FOCUS_BY_ID[id].emoji} ${esc(focusName(FOCUS_BY_ID[id]))}${id === picked ? ' (you)' : ''}</span><span class="pc">${p}%</span><span class="g" style="color:${g >= 0 ? 'var(--good)' : 'var(--bad)'}">${g >= 0 ? '▲' : '▼'}</span><span class="track"><i style="width:${p}%"></i></span></div>`;
  }).join('');
  const gd = G.grades[day], bf = FOCUS_BY_ID[gd.best];
  const pctBest = picks[gd.best] ? Math.round(picks[gd.best].n / total * 100) : 0;
  const verdict = { best: 'You found it.', solid: 'A good call, but not the best one.', weak: 'You missed this one.' }[gd.grade];
  const bestBox = `<div class="bestmove ${gd.grade}"><span class="sq">${SQ[gd.grade]}</span><div><p class="bm-lbl">BEST MOVE FOR YOUR VILLAGE</p><p><b>${bf.emoji} ${esc(focusName(bf))}</b>. ${pctBest <= 1 ? 'Almost nobody' : pctBest + '% of villages'} chose it.</p><p class="bm-you">${verdict}${gd.grade !== 'best' ? ` You picked ${esc(focusName(FOCUS_BY_ID[picked]))}.` : ''}</p></div></div>`;
  const insight = `${pctMine <= 8 ? `Only ${pctMine}% made the same call as you.` : `${pctMine}% made the same call as you.`}`;
  const ri = rankInfo(s), last = day === SEASON.days;
  const f = FOCUS_BY_ID[picked];
  $('sheet').innerHTML = `<h3 id="sheetTitle">${last ? 'The season ends' : 'Day ' + day}</h3>
    ${bestBox}
    <div class="storybox">${r.log.slice(0, 3).map(l => `<p>${esc(T(l))}</p>`).join('')}</div>
    ${r.echo.map(e => `<p class="echo"><b>YOUR PAST CATCHES UP</b>${esc(T(e))}</p>`).join('')}
    <div class="shifts">${shifts}</div>
    <div class="rankline"><span>Score <b>${fmt(b.ranked)} → ${fmt(s.ranked)}</b> (${myGain >= 0 ? '+' : ''}${(myGain * 100).toFixed(0)}%)</span><span>Rank <b>#${ri.rank}</b> of ${ri.total} · top ${ri.top}%</span></div>
    <h4>Everyone else <small class="gridsmall">${gridLine()}</small></h4>
    <div class="crowd">${crowdHtml}</div>
    ${insight && picked !== gd.best ? `<p class="insight">${insight}</p>` : ''}
    <details class="mini"><summary>Today's numbers</summary><ul>${r.ledger.map(l => `<li>${esc(T(l))}</li>`).join('')}<li>Harmony ${b.harmony} → ${a.harmony}, Power ${b.power} → ${a.power}, Wealth ${b.wealth} → ${a.wealth}</li></ul></details>
    ${last ? seasonSummary() : `<div class="row2"><button class="big" id="nextDay">Begin day ${day + 1}</button></div>`}`;
  $('overlay').hidden = false;
  if (last) wireSummary(); else $('nextDay').onclick = () => { $('overlay').hidden = true; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  $('overlay').scrollTop = 0;
  ($('nextDay') || $('copyShare')).focus({ preventScroll: true });
}

function seasonSummary() {
  const s = G.s, ri = rankInfo(s), st = stats(s, G.orders);
  const side = fn => 1 + G.crowd.filter(b => fn(stats(b.s, b.orders)) > fn(st)).length;
  const lb = [...G.crowd.map(b => ({ name: b.name, v: b.s.ranked })), { name: 'You', v: s.ranked, me: true }].sort((x, y) => y.v - x.v);
  const myIdx = lb.findIndex(x => x.me);
  const shown = lb.slice(0, 5).concat(myIdx >= 5 ? [lb.at(myIdx)] : []);
  const counts = { best: 0, solid: 0, weak: 0 };
  Object.values(G.grades).forEach(g => counts[g.grade]++);
  return `<div class="seasongrid"><p class="bm-lbl">YOUR SEASON</p><p class="bigrid">${gridLine()}</p><p class="bm-you">${counts.best} best move${counts.best === 1 ? '' : 's'} · ${counts.solid} good · ${counts.weak} missed</p></div>
    <h4>Final standings</h4>
    <table class="lb">${shown.map((x, i) => `<tr class="${x.me ? 'me' : ''}"><td>#${x.me ? myIdx + 1 : i + 1}</td><td>${esc(x.name)}</td><td>${fmt(x.v)}</td></tr>`).join('')}</table>
    <div class="rankline"><span>Richest <b>#${side(x => x.wealth)}</b></span><span>Happiest <b>#${side(x => x.harmony)}</b></span><span>Strongest <b>#${side(x => x.power)}</b></span></div>
    <pre class="share" id="share">Thirty Days · ${TH().season.split(' · ')[1]} · prototype
Score ${fmt(s.ranked)} · top ${ri.top}%
${gridLine()}  ${counts.best}/${SEASON.days} best moves
🏘 ${T(MOODS.harmony(st.harmony))} · ${T(MOODS.power(st.power))} · ${T(MOODS.wealth(st.wealth))}</pre>
    <div class="row2"><button class="big" id="copyShare">Copy result</button><button class="ghost" id="again">Play the week again</button></div>
    <p class="note">The real game runs 30 days, against everyone playing that month.</p>`;
}
function wireSummary() {
  $('copyShare').onclick = async e => {
    const txt = $('share').textContent;
    try { await navigator.clipboard.writeText(txt); e.target.textContent = 'Copied'; }
    catch { const r = document.createRange(); r.selectNodeContents($('share')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); e.target.textContent = 'Selected, copy it'; }
  };
  $('again').onclick = () => { $('overlay').hidden = true; newGame(G.seed + 1); window.scrollTo({ top: 0 }); };
}

$('endDay').onclick = endDay;
$('ordersToggle').onclick = () => { const d = $('dials'); d.hidden = !d.hidden; $('ordersToggle').setAttribute('aria-expanded', !d.hidden); $('ordersToggle').querySelector('.chev').textContent = d.hidden ? 'Change' : 'Done'; };
['frontier', 'fleet'].forEach(t => $('th-' + t).onclick = () => { theme = t; $('th-frontier').setAttribute('aria-pressed', t === 'frontier'); $('th-fleet').setAttribute('aria-pressed', t === 'fleet'); render(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('overlay').hidden && $('nextDay')) $('nextDay').click(); });

// ---------------------------------------------------------------------------
// How to play: a short tour that points at the real screen. Skippable, replayable.
// ---------------------------------------------------------------------------
const TOUR = [
  { title: 'Welcome, chief', text: 'You lead a small frontier village for thirty days (this prototype is one week). Each day you make one big choice. At the end, your village is ranked against everyone else\'s.', start: true },
  { target: 'moods', title: 'How your village is doing', text: 'Keep Harmony, Power and Wealth healthy, and keep food in the stores. Your score multiplies them together, so one weak spot drags everything down.' },
  { target: ['council', 'board'], title: 'Your clues', text: 'Your council tells you what\'s worrying them, and the forecast shows what\'s coming. Read them before you choose. They point to the best move.' },
  { target: 'cards', title: 'Pick one Focus', text: 'This is the day\'s big decision. Tap a card to read more. TODAY cards vanish tomorrow. 🎲 cards are gambles with the odds shown.' },
  { target: 'orders', title: 'Your standing orders', text: 'These run everything you don\'t focus on: how hard people work, how well they eat, who gets through the gates, and how strong your guard is. Set them and leave them, or change them when things change.' },
  { target: 'endDay', title: 'End the day', text: 'See what happened, how everyone else chose, and whether you found the best move. Try to fill your season with 🟩.', last: true },
];
let tourAt = -1, tourEls = [], dim = null;
function clearTourFocus() { tourEls.forEach(el => el.classList.remove('tour-focus')); tourEls = []; if (dim) { dim.remove(); dim = null; } }
function showTour(i) {
  tourAt = i; clearTourFocus();
  const st = TOUR[i], card = $('tourCard');
  $('tourBlock').hidden = false; card.hidden = false;
  $('tourStep').textContent = st.start ? 'HOW TO PLAY · 30 SECONDS' : `STEP ${i} OF ${TOUR.length - 1}`;
  $('tourTitle').textContent = T(st.title);
  $('tourText').textContent = T(st.text);
  $('tourDots').innerHTML = TOUR.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('');
  $('tourBack').hidden = i === 0;
  $('tourNext').textContent = st.start ? 'Show me' : st.last ? 'Start playing' : 'Next';
  $('tourSkip').textContent = st.start ? 'Skip, I\'ll figure it out' : 'Skip';
  card.className = 'tour-card';
  if (!st.target) { dim = document.createElement('div'); dim.className = 'tour-dim'; document.body.appendChild(dim); card.classList.add('center'); }
  else {
    tourEls = [].concat(st.target).map(id => $(id)).filter(Boolean);
    tourEls[0].scrollIntoView({ block: 'center', behavior: 'auto' });
    tourEls.forEach(el => el.classList.add('tour-focus'));
    const r = tourEls.at(-1).getBoundingClientRect(), top = tourEls[0].getBoundingClientRect();
    card.classList.add(r.bottom > window.innerHeight - 230 && top.top > 230 ? 'at-top' : 'at-bottom');
  }
  $('tourNext').focus({ preventScroll: true });
}
function endTour() {
  clearTourFocus(); tourAt = -1;
  $('tourBlock').hidden = true; $('tourCard').hidden = true;
  try { localStorage.setItem('thirtydays-tour-seen', '1'); } catch (e) { /* storage unavailable */ }
  window.scrollTo({ top: 0 });
}
$('tourNext').onclick = () => tourAt >= TOUR.length - 1 ? endTour() : showTour(tourAt + 1);
$('tourBack').onclick = () => showTour(Math.max(0, tourAt - 1));
$('tourSkip').onclick = endTour;
$('howTo').onclick = () => { if ($('overlay').hidden) showTour(0); };
document.addEventListener('keydown', e => {
  if (tourAt < 0) return;
  if (e.key === 'Escape') { e.preventDefault(); endTour(); }
  if (e.key === 'ArrowRight') $('tourNext').click();
  if (e.key === 'ArrowLeft' && tourAt > 0) $('tourBack').click();
});
window.addEventListener('resize', () => { if (tourAt >= 0) showTour(tourAt); });
let seenTour = false;
try { seenTour = localStorage.getItem('thirtydays-tour-seen') === '1'; } catch (e) { seenTour = false; }
newGame(20261023);
if (!seenTour) showTour(0);
</script>
