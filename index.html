<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Thirty Days: a daily settlement game. One village, thirty days, one decision a day.">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font: 14px system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Thirty Days</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@500;700;800&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Caveat:wght@500;700&display=swap">
<style>
/* Frontier almanac. The village fills the screen; a wooden board on the right (a drawer under the village on phones)
   holds the day's two pinned papers and a wax-seal button. One committed parchment-and-ink look, no dark variant. */
:root {
  --paper: #f1e3c2;      /* almanac paper */
  --paper-2: #e5d1a4;    /* aged edge, wells, rules */
  --wood: #6b4428;       /* the board */
  --wood-dark: #3f2716;
  --ink: #3a2516;        /* brown ink */
  --ink-soft: #77583d;
  --seal: #a3302a;       /* red wax */
  --seal-dark: #6e1c18;
  --brass: #c89632;
  --good: #4f7a26;
  --bad: #a3302a;
  --harmony: #c2456b; --power: #3d6e9c; --wealth: #b07d12; --food: #5d8a2a;
  --sky: #9cc9dc;
  --font-pixel: "Alegreya Sans", "Trebuchet MS", system-ui, sans-serif;
  --font-text: "Alegreya", Georgia, "Times New Roman", serif;
  --font-hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--wood-dark); color: var(--ink); font-family: var(--font-text); font-size: 16px; line-height: 1.4; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
.px { display: block; image-rendering: pixelated; flex: none; }

/* ---------- the screen ---------- */
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 404px; }
.stage { position: relative; overflow: hidden; background: var(--sky); min-height: 0; }
.stage canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: manipulation; }

/* HUD pieces float over the village like scraps of paper */
.hud-top { position: absolute; z-index: 4; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 10px;
  padding: max(12px, env(safe-area-inset-top, 0px)) 12px 0 max(12px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.hud-top > * { pointer-events: auto; }
.tag { background: var(--paper); border: 2px solid var(--ink); box-shadow: 3px 3px 0 rgba(58, 37, 22, .35); }
.brand { display: grid; gap: 3px; padding: 6px 10px 7px; }
.brand .logo { font-family: var(--font-pixel); font-weight: 700; font-size: .9rem; line-height: 1; color: var(--seal); }
.brand .day { display: flex; align-items: baseline; gap: 6px; font-family: var(--font-pixel); line-height: 1; }
.brand .day b { font-size: 1.5rem; font-weight: 700; }
.brand .day span { font-size: .85rem; color: var(--ink-soft); }
.brand .day em { font-style: normal; font-size: .8rem; color: var(--seal); margin-left: auto; padding-left: 8px; }
.sq { display: flex; gap: 2px; }
.sq i { width: 9px; height: 9px; border: 1px solid var(--ink); background: transparent; }
.sq i.best { background: #6aa336; } .sq i.solid { background: #e2b33a; } .sq i.weak { background: var(--seal); } .sq i.now { border-style: dashed; }

.almanac { flex: 1 1 auto; display: flex; justify-content: center; min-width: 0; }
.alm { display: flex; gap: 0; padding: 0; }
.alm button { position: relative; background: transparent; border: 0; border-left: 1px dashed var(--paper-2); padding: 5px 7px 4px; display: grid; justify-items: center; gap: 2px; min-width: 50px; }
.alm button:first-child { border-left: 0; }
.alm button .d { font-family: var(--font-pixel); font-size: .72rem; line-height: 1; color: var(--ink-soft); }
.alm button .c { font-family: var(--font-pixel); font-size: .66rem; line-height: 1; color: var(--ink-soft); }
.alm button .c.sure { color: var(--good); }
.alm button.today { background: var(--paper-2); }
.alm button.today .d { color: var(--seal); font-weight: 700; }
.alm button.fog .px { opacity: .35; }
.alm button[aria-expanded="true"] { box-shadow: inset 0 -3px 0 var(--seal); }
.tools { display: flex; gap: 8px; align-items: flex-start; }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; padding: 0; }
.iconbtn:hover { background: #fff3d6; }
.iconbtn b { font-family: var(--font-pixel); font-size: 1.3rem; line-height: 1; }
.themes { display: flex; height: 44px; }
.themes button { background: transparent; border: 0; padding: 0 9px; font-family: var(--font-pixel); font-size: .8rem; color: var(--ink-soft); }
.themes button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

.hud-bot { position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end;
  padding: 0 12px max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.hud-bot > * { pointer-events: auto; }
.moods { display: flex; padding: 4px 4px 3px; }
.mood { background: transparent; border: 0; padding: 2px 8px; display: grid; justify-items: center; gap: 2px; min-width: 62px; }
.mood + .mood { border-left: 1px dashed var(--paper-2); }
.meter { position: relative; width: 30px; height: 30px; }
.meter .px { position: absolute; left: 0; bottom: 0; width: 30px; height: 30px; }
.meter .fill { position: absolute; left: 0; right: 0; bottom: 0; overflow: hidden; }
.mood .mw { font-family: var(--font-pixel); font-size: .74rem; line-height: 1; white-space: nowrap; }
.mood .mn { font-family: var(--font-pixel); font-weight: 700; font-size: .95rem; line-height: 1; font-variant-numeric: tabular-nums; }
.res { display: flex; gap: 12px; padding: 7px 10px; font-family: var(--font-pixel); font-size: .95rem; font-variant-numeric: tabular-nums; }
.res span { display: inline-flex; align-items: center; gap: 5px; }

.note { position: absolute; z-index: 6; max-width: min(300px, calc(100% - 24px)); padding: 8px 11px; font-size: .95rem; line-height: 1.3; }
.note b { display: block; font-family: var(--font-pixel); font-size: .8rem; color: var(--seal); margin-bottom: 2px; }

.bubble { position: absolute; z-index: 5; width: min(240px, 66%); background: rgba(40, 24, 12, .55); color: #fff8e6; border: 0; padding: 5px 9px; font-size: .92rem; line-height: 1.3; cursor: pointer; text-shadow: 0 1px 2px rgba(0, 0, 0, .9); }
.bubble b { font-family: var(--font-pixel); font-weight: 500; color: var(--who, #ffe08a); } .bubble small { color: #eadcc0; }
.bubble p { margin: 1px 0 0; }
.bubble::after { content: ""; position: absolute; left: calc(var(--tail, 30px) - 5px); bottom: -6px; border: 5px solid transparent; border-top-color: rgba(40, 24, 12, .55); border-bottom: 0; }
.bubble.below::after { bottom: auto; top: -6px; border-top: 0; border-bottom: 5px solid rgba(40, 24, 12, .55); }

/* ---------- the board ---------- */
.panel { background-color: var(--wood); background-image: repeating-linear-gradient(90deg, rgba(0, 0, 0, .07) 0 2px, transparent 2px 23px), repeating-linear-gradient(0deg, rgba(255, 255, 255, .03) 0 1px, transparent 1px 7px);
  border-left: 4px solid var(--wood-dark); overflow-y: auto; display: flex; flex-direction: column; gap: 9px;
  padding: max(10px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) 12px; }
.sheet-paper { position: relative; background: var(--paper); padding: 12px 14px 11px; box-shadow: 0 3px 0 rgba(0, 0, 0, .25); display: grid; gap: 8px; }
.sheet-paper::before, .sheet-paper::after { content: ""; position: absolute; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--brass); box-shadow: inset -1px -1px 0 rgba(0, 0, 0, .35); }
.sheet-paper::before { left: 7px; } .sheet-paper::after { right: 7px; }
.dateline { margin: 0; font-family: var(--font-pixel); font-size: .8rem; color: var(--ink-soft); }
.headline { margin: 0; font-family: var(--font-text); font-weight: 700; font-size: 1.12rem; line-height: 1.2; text-wrap: balance; }
.sect { margin: 2px 0 0; font-family: var(--font-pixel); font-weight: 700; font-size: 1rem; display: flex; align-items: baseline; gap: 8px; border-top: 2px solid var(--ink); padding-top: 7px; }
.sect small { font-family: var(--font-text); font-weight: 400; font-style: italic; font-size: .88rem; color: var(--ink-soft); }
.sheet-paper .sect:first-child { border-top: 0; padding-top: 0; }

.tiles { position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 7px; padding-top: 3px; }
.tile { position: relative; text-align: left; background: #f8edd3; border: 2px solid var(--ink-soft); padding: 5px 7px 4px; min-height: 40px; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 1px 7px; align-items: center; min-width: 0;
  transition: transform .12s ease-out, box-shadow .12s ease-out; }
.tile > .px { width: 26px; height: 26px; }
.tile .nm { font-weight: 700; font-size: .92rem; line-height: 1.15; align-self: center; }
.tile .nm .ar { display: block; font-weight: 400; }
.tile .ar { font-size: .8rem; line-height: 1.2; color: var(--ink-soft); }
.tile:hover:not([aria-disabled="true"]) { border-color: var(--ink); }
.tile[aria-pressed="true"] { border-color: var(--ink); background: #fffaf0; transform: translateY(-3px); box-shadow: 0 4px 0 var(--ink); }
.tile[aria-pressed="true"]::after { content: ""; position: absolute; right: -6px; bottom: -6px; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #c9443c, var(--seal) 60%, var(--seal-dark)); }
.tile[aria-disabled="true"] { opacity: .5; }
.tile.group { border-style: dashed; background: transparent; }
.ribbon { position: absolute; top: -10px; right: 6px; font-family: var(--font-pixel); font-size: .68rem; line-height: 1; padding: 3px 5px 5px; color: #fff4dc; background: var(--seal);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 75%, 0 100%); }
.ribbon.new { background: var(--power); }
.die { position: absolute; top: -7px; right: -7px; }
.ribbon + .die { right: 46px; }
.detail { min-height: 4em; font-size: .95rem; line-height: 1.3; border-top: 1px dashed var(--ink-soft); padding-top: 7px; }
.detail p { margin: 0; }
.detail .arw { font-family: var(--font-pixel); font-size: .85rem; color: var(--seal); margin-bottom: 2px; }
.detail .placeholder { color: var(--ink-soft); font-style: italic; }
.detail .dn { font-weight: 700; }
.detail .odds { color: var(--seal); font-size: .88rem; margin-top: 2px; }
.detail .why { color: var(--seal); font-size: .88rem; font-style: italic; }

#dials { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 14px; }
.dial { display: grid; gap: 1px; min-width: 0; align-content: start; }
.dial .nm { display: flex; align-items: center; gap: 6px; font-family: var(--font-pixel); font-size: .9rem; }
.dial .nm .px { width: 18px; height: 18px; }
.lever { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.lever::before { content: ""; position: absolute; left: 16.6%; right: 16.6%; top: 8px; height: 4px; background: var(--wood); border-radius: 2px; }
.lever button { position: relative; background: transparent; border: 0; padding: 0 0 2px; display: grid; justify-items: center; gap: 2px; font-size: .78rem; color: var(--ink-soft); }
.lever button::before { content: ""; width: 10px; height: 10px; margin-top: 5px; margin-bottom: 1px; border-radius: 50%; background: var(--paper); border: 2px solid var(--wood); box-sizing: border-box; }
.lever button[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
.lever button[aria-pressed="true"]::before { width: 18px; height: 18px; margin-top: 1px; margin-bottom: -3px; background: radial-gradient(circle at 35% 30%, #f3d27a, var(--brass) 55%, #7f5b16); border: 2px solid var(--ink); }
.dial .arrows { font-size: .76rem; line-height: 1.15; color: var(--ink-soft); }
.dial .arrows:empty { display: none; }

.seal { margin-top: auto; flex: none; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--paper); border: 3px solid var(--ink); padding: 6px 14px 6px 8px; box-shadow: 0 4px 0 var(--ink); }
.seal .wax { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 38% 32%, #cf4a40, var(--seal) 55%, var(--seal-dark)); box-shadow: 0 0 0 3px rgba(163, 48, 42, .35), inset -3px -4px 0 rgba(0, 0, 0, .2); }
.seal .wax .px { width: 28px; height: 28px; }
.seal .st { display: grid; gap: 1px; }
.seal .st b { font-family: var(--font-pixel); font-weight: 700; font-size: 1.35rem; line-height: 1; }
.seal .st small { font-size: .88rem; color: var(--ink-soft); font-style: italic; }
.seal:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.seal:disabled { cursor: not-allowed; box-shadow: 0 4px 0 var(--ink-soft); border-color: var(--ink-soft); }
.seal:disabled .wax { background: var(--paper-2); box-shadow: inset 0 0 0 2px var(--ink-soft); }
.seal:disabled .wax .px { opacity: .35; }
.seal:disabled .st b { color: var(--ink-soft); }
body.dusk .panel { pointer-events: none; }
body.dusk .panel .sheet-paper, body.dusk .seal { filter: brightness(.82); }

/* ---------- phone: the village on top, the board slides up under it as a drawer ---------- */
@media (max-width: 899px) {
  body { overflow: auto; }
  html, body { height: auto; }
  .app { display: block; }
  .stage { height: clamp(400px, 64vh, 560px); }
  .brand .logo span { display: none; }
  .panel > .themes { align-self: center; }
  .panel { position: relative; z-index: 5; margin-top: -18px; border-left: 0; border-top: 4px solid var(--wood-dark); border-radius: 14px 14px 0 0; overflow: visible;
    padding: 18px max(14px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); }
  .panel::before { content: ""; position: absolute; top: 6px; left: 50%; width: 46px; height: 5px; margin-left: -23px; border-radius: 3px; background: var(--wood-dark); }
  .hud-bot { padding-bottom: 26px; }
  .almanac { order: 3; flex-basis: 100%; justify-content: flex-start; }
  .hud-top { gap: 6px 8px; }
  .brand { padding: 5px 8px 6px; }
  .brand .logo { font-size: .78rem; }
  .brand .day b { font-size: 1.15rem; }
  .iconbtn, .themes { height: 40px; } .iconbtn { width: 40px; }
  .tools { margin-left: auto; }
  .alm button { min-width: 0; padding: 5px 5px 4px; }
  .mood { min-width: 0; padding: 2px 5px; }
  .res { gap: 8px; font-size: .85rem; padding: 6px 8px; }
}
@media (max-width: 420px) {
  .tiles { gap: 6px; }
  .tile { padding: 6px 6px; grid-template-columns: 22px minmax(0, 1fr); gap: 1px 6px; }
  .tile > .px { width: 22px; height: 22px; }
  .themes button { padding: 0 6px; font-size: .74rem; }
  .meter, .meter .px { width: 26px; height: 26px; }
}

/* ---------- overlays: the Chronicle and the ledger book ---------- */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(28, 18, 40, .55); overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.overlay[hidden] { display: none; }
.chron { max-width: 700px; margin: 8px auto; background: var(--paper); padding: 16px 20px 18px; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); display: grid; gap: 12px;
  background-image: radial-gradient(ellipse at 20% 0%, rgba(255, 255, 255, .35), transparent 60%), radial-gradient(ellipse at 100% 100%, rgba(140, 100, 40, .16), transparent 55%); }
@media (prefers-reduced-motion: no-preference) { .chron { animation: rise .45s cubic-bezier(.2, .8, .3, 1); } @keyframes rise { from { transform: translateY(60px); opacity: 0; } } }
.mast { text-align: center; border-bottom: 3px double var(--ink); padding-bottom: 6px; display: grid; gap: 3px; }
.mast h3 { margin: 0; font-family: var(--font-pixel); font-weight: 700; font-size: clamp(1.5rem, 5.5vw, 2.3rem); line-height: 1; letter-spacing: .01em; }
.mast p { margin: 0; display: flex; justify-content: space-between; gap: 8px; font-size: .85rem; font-style: italic; color: var(--ink-soft); border-top: 1px solid var(--ink); padding-top: 3px; }
.lead { margin: 0; font-weight: 700; font-size: clamp(1.25rem, 3.6vw, 1.6rem); line-height: 1.15; text-wrap: balance; }
.story.cols { columns: 2 230px; column-gap: 22px; column-rule: 1px solid var(--paper-2); font-size: 1.02rem; line-height: 1.45; }
.story { font-size: 1.02rem; line-height: 1.45; }
.story p { margin: 0 0 6px; }
.story p:first-child::first-letter { font-family: var(--font-pixel); font-weight: 700; float: left; font-size: 2.6em; line-height: .8; padding: 4px 6px 0 0; color: var(--seal); }
.echo { margin: 0; font-style: italic; border-left: 3px solid var(--seal); padding-left: 10px; }
.echo b { font-style: normal; font-family: var(--font-pixel); font-size: .8rem; color: var(--seal); display: block; }
.ccols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 560px) { .ccols { grid-template-columns: minmax(0, 1fr); } }
.box { border: 2px solid var(--ink); padding: 9px 11px; display: grid; gap: 6px; align-content: start; }
.box h4 { margin: 0; font-family: var(--font-pixel); font-weight: 700; font-size: .95rem; }
.box p { margin: 0; }
.bm { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; }
.bm .grade { width: 30px; height: 30px; border: 2px solid var(--ink); }
.bm .grade.best { background: #6aa336; } .bm .grade.solid { background: #e2b33a; } .bm .grade.weak { background: var(--seal); }
.bm .you { color: var(--ink-soft); font-style: italic; font-size: .92rem; }
.shifts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.shift { display: grid; justify-items: center; gap: 1px; text-align: center; font-size: .8rem; line-height: 1.1; }
.shift .px { width: 26px; height: 26px; }
.shift b { font-family: var(--font-pixel); font-size: 1rem; line-height: 1; }
.shift .up { color: var(--good); } .shift .down { color: var(--bad); } .shift .flat { color: var(--ink-soft); }
.counts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--font-pixel); font-size: .9rem; justify-content: center; border-top: 1px dashed var(--ink-soft); padding-top: 6px; }
.counts span { display: inline-flex; gap: 4px; align-items: center; }
.counts .up { color: var(--good); } .counts .down { color: var(--bad); }
.crowd { display: grid; gap: 5px; }
.cbar { display: grid; grid-template-columns: 18px minmax(0, 1fr) 38px; gap: 2px 7px; align-items: center; font-size: .9rem; }
.cbar .px { width: 18px; height: 18px; }
.cbar .pc { font-family: var(--font-pixel); font-size: .85rem; text-align: right; font-variant-numeric: tabular-nums; }
.cbar .track { grid-column: 2 / -1; height: 7px; background: var(--paper-2); }
.cbar .track i { display: block; height: 100%; background: var(--ink-soft); }
.cbar.mine .track i { background: var(--seal); } .cbar.mine .n { font-weight: 700; }
.cbar .g { font-size: .8rem; }
.rankline { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 20px; font-size: .98rem; border-top: 3px double var(--ink); padding-top: 8px; }
.rankline b { font-family: var(--font-pixel); color: var(--seal); }
details.mini > summary { cursor: pointer; font-size: .9rem; color: var(--ink-soft); font-style: italic; }
details.mini ul { margin: 6px 0 0; padding-left: 18px; font-size: .9rem; display: grid; gap: 2px; }
.morning { justify-self: center; display: inline-flex; align-items: center; gap: 10px; background: var(--ink); color: var(--paper); border: 0; padding: 10px 22px 10px 14px; font-family: var(--font-pixel); font-weight: 700; font-size: 1.15rem; box-shadow: 0 4px 0 var(--seal-dark); }
.morning:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--seal-dark); }
.plain { background: transparent; border: 2px solid var(--ink); padding: 8px 14px; font-family: var(--font-pixel); font-size: .95rem; }
.row2 { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.seasongrid { display: grid; gap: 6px; justify-items: center; text-align: center; }
.seasongrid .sq i { width: 26px; height: 26px; border-width: 2px; }
.seasongrid .sq { gap: 5px; }
.lb { width: 100%; border-collapse: collapse; font-size: .95rem; }
.lb td { padding: 3px 6px; border-top: 1px dashed var(--ink-soft); }
.lb td:last-child { text-align: right; font-family: var(--font-pixel); font-variant-numeric: tabular-nums; }
.lb tr.me td { color: var(--seal); font-weight: 700; }
pre.share { margin: 0; padding: 10px 12px; background: #fbf4e2; border: 2px dashed var(--ink-soft); font-family: var(--font-text); white-space: pre-wrap; font-size: .95rem; }

<script>
// ============================================================================
// THIRTY DAYS — rules, story and content (no DOM). The page and tests load this.
//
// THE MODEL (all of this runs in the background; players see words and arrows)
//   Resources are what you HAVE:  Food, Gold, Materials, Settlers.
//   Scores are how you're DOING:  Wealth, Harmony, Power.
//     Wealth  = everything you own (Gold + Materials + buildings)
//     Harmony = built from Food (fed or hungry), your orders, buildings, recent events
//     Power   = built from Settlers (defenders), Militia, walls, recent training
//   Scores feed back: Harmony boosts all output, Power protects your stores.
//   Settlement score = Wealth × Harmony × Power.
// ============================================================================

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const r0 = v => Math.round(v);

const SEASON = { days: 7, start: { food: 60, gold: 40, materials: 20, pop: 12, mood: 0, training: 2 } };

// ---------- Standing orders: four dials ----------
const ORDER_FX = {
  work:  { output: [0.85, 1, 1.25], gold: [0.5, 0.8, 1.2], harmony: [10, 0, -14] },
  table: { eat: [0.7, 1, 1.4], harmony: [-8, 0, 10] },
  gates: { harmony: [0, 0, -4], raid: [1.3, 1, 0.6] },
  guard: { power: [0, 10, 25], gold: [0, 3, 8], food: [0, 0, 3] },
};
const DIALS = [
  { id: 'work',  name: 'Work',  opts: ['Easy', 'Steady', 'Hard'],
    arrows: ['Output ↓ · Gold ↓ · Harmony ↑↑', 'Steady', 'Output ↑ · Gold ↑ · Harmony ↓↓'],
    hint: ['Output 85% · 0.5 Gold per settler · Harmony +10', 'Output 100% · 0.8 Gold per settler', 'Output 125% · 1.2 Gold per settler · Harmony −14'] },
  { id: 'table', name: 'Table', opts: ['Lean', 'Normal', 'Feast'],
    arrows: ['Food lasts longer · Harmony ↓', 'Steady', 'Food ↓↓ · Harmony ↑↑'],
    hint: ['0.7 Food each · Harmony −8', '1 Food each', '1.4 Food each · Harmony +10'] },
  { id: 'gates', name: 'Gates', opts: ['Open', 'Watched', 'Shut'],
    arrows: ['Settlers ↑↑ while people are happy · raids hit harder', 'Settlers ↑ while people are content', 'No newcomers · raids hit softer · Harmony ↓'],
    hint: ['+2 settlers a day if Harmony 40+ · raids ×1.3', '+1 settler a day if Harmony 55+', 'No newcomers · raids ×0.6 · Harmony −4'] },
  { id: 'guard', name: 'Guard', opts: ['None', 'Patrol', 'Garrison'],
    arrows: ['Free · Power ↓', 'Power ↑ · costs a little Gold', 'Power ↑↑ · costs Gold and Food'],
    hint: ['Power +0', 'Power +10 · 3 Gold a day', 'Power +25 · 8 Gold and 3 Food a day'] },
];
const DEFAULT_ORDERS = { work: 1, table: 1, gates: 1, guard: 1 };

// ---------- Buildings ----------
const BUILDINGS = {
  fields:   { name: 'Fields',   cost: { materials: 20, gold: 5 },  desc: '+4 Food a day', story: 'Fresh furrows on the south slope. More grain every day.', arrows: 'Food ↑ every day' },
  sawmill:  { name: 'Sawmill',  cost: { materials: 10, gold: 15 }, desc: '+6 Materials a day', story: 'A waterwheel and a saw that never tires.', arrows: 'Materials ↑ every day' },
  market:   { name: 'Market',   cost: { materials: 20, gold: 10 }, desc: '+6 Gold a day, Harmony +3, unlocks Host a fair', story: 'Stalls in the square. Pip is beside himself.', arrows: 'Gold ↑ every day · Harmony ↑ · unlocks fairs' },
  tavern:   { name: 'Tavern',   cost: { materials: 15, gold: 15 }, desc: 'Harmony +8, unlocks Tavern night', story: 'Somewhere to sit, drink, and complain. Everyone is happier for it.', arrows: 'Harmony ↑↑ for good · unlocks tavern nights' },
  palisade: { name: 'Palisade', cost: { materials: 30, gold: 10 }, desc: 'Power +10, unlocks Man the walls', story: 'Sharpened logs around the whole settlement. Rook finally sleeps.', arrows: 'Power ↑↑ for good · unlocks manning the walls' },
};
const BUILDING_VALUE = 20;
const has = (s, b) => s.buildings.includes(b);
const canAfford = (s, cost) => Object.entries(cost).every(([k, v]) => s[k] >= v);
const pay = (s, cost) => Object.entries(cost).forEach(([k, v]) => { s[k] -= v; });

// ---------- Scores (sums of named parts; shown only in the Ledger) ----------
function eatenPerDay(s, o) { return s.pop * ORDER_FX.table.eat[o.table]; }
function stats(s, o) {
  const eat = eatenPerDay(s, o), days = eat > 0 ? s.food / eat : 9;
  const h = [['Base', 40]];
  if (days >= 3) h.push(['Well fed (3+ days of Food)', 15]);
  else if (days >= 1) h.push(['Food is getting low', 5]);
  else h.push(['Hungry (less than a day of Food)', -15]);
  const hp = (lbl, v) => { if (v) h.push([lbl, v]); };
  hp('Table: ' + DIALS[1].opts[o.table], ORDER_FX.table.harmony[o.table]);
  hp('Work: ' + DIALS[0].opts[o.work], ORDER_FX.work.harmony[o.work]);
  hp('Gates: ' + DIALS[2].opts[o.gates], ORDER_FX.gates.harmony[o.gates]);
  if (has(s, 'tavern')) hp('Tavern', 8);
  if (has(s, 'market')) hp('Market', 3);
  hp('Good memories', s.legacy || 0);
  hp('Recent events', r0(s.mood));
  const harmony = clamp(h.reduce((a, [, v]) => a + v, 0), 5, 100);
  const p = [['Settlers as defenders', r0(s.pop * 1.5)]];
  const pp = (lbl, v) => { if (v) p.push([lbl, v]); };
  pp('Guard: ' + DIALS[3].opts[o.guard], ORDER_FX.guard.power[o.guard]);
  if (has(s, 'palisade')) pp('Palisade', 10);
  pp('Recent training', r0(s.training));
  if (harmony < 30) pp('Low morale', -10);
  const power = clamp(p.reduce((a, [, v]) => a + v, 0), 5, 100);
  const w = [['Gold', s.gold], ['Materials (half value until used)', r0(s.materials * 0.5)], ['Food in store (quarter value)', r0(s.food * 0.25)]];
  if (s.buildings.length) w.push([`Buildings (${s.buildings.length} × ${BUILDING_VALUE})`, s.buildings.length * BUILDING_VALUE]);
  const wealth = Math.max(1, w.reduce((a, [, v]) => a + v, 0));
  const output = +(0.7 + harmony * 0.006).toFixed(2);
  // Temporary boosts (recent events, training) count half toward the score, so lasting choices win over time
  const scoreH = clamp(harmony - r0(s.mood) * 0.5, 5, 100), scoreP = clamp(power - r0(s.training) * 0.5, 5, 100);
  const score = r0(wealth * scoreH * scoreP / 1000);
  // Lasting score ignores temporary boosts entirely; the crowd reveal compares on this
  const lasting = r0(wealth * clamp(harmony - r0(s.mood), 5, 100) * clamp(power - r0(s.training), 5, 100) / 1000);
  return { harmony, harmonyParts: h, power, powerParts: p, wealth, wealthParts: w, output, score, scoreH, scoreP, lasting, foodDays: days };
}

// ---------- Words instead of numbers ----------
const MOODS = {
  harmony: v => v >= 75 ? 'Joyful' : v >= 55 ? 'Content' : v >= 35 ? 'Restless' : 'Angry',
  power:   v => v >= 60 ? 'Fortified' : v >= 45 ? 'Guarded' : v >= 25 ? 'Thin' : 'Exposed',
  wealth:  v => v >= 300 ? 'Prosperous' : v >= 160 ? 'Comfortable' : v >= 80 ? 'Getting by' : 'Poor',
  food:    d => d >= 6 ? 'Plenty' : d >= 3 ? 'Enough' : d >= 1 ? 'Running low' : 'Starving',
};

// ---------- The cast ----------
const CAST = {
  marta: { name: 'Old Marta', role: 'the elder', face: '👵' },
  rook:  { name: 'Captain Rook', role: 'the militia', face: '🛡️' },
  pip:   { name: 'Pip', role: 'the trader', face: '🧮' },
  hollis:{ name: 'Hollis', role: 'the farmer', face: '🧑‍🌾' },
};
// What the cast says at the morning council. Each rule: who, priority, when(s, st, o, day), line
const COUNCIL = [
  { who: 'hollis', p: 9, when: (s, st) => st.foodDays < 1, line: 'We\'re eating the seed grain. If nothing changes, families will start leaving.' },
  { who: 'hollis', p: 6, when: (s, st) => st.foodDays < 2.5, line: 'The granary\'s getting thin. One bad day and we\'re in trouble.' },
  { who: 'hollis', p: 7, when: (s, st, o, d) => d === 3 && s.scoutedUntil >= 4, line: 'Word is a storm hits tomorrow. Whatever we need from outside, we\'d best grab it today.' },
  { who: 'hollis', p: 8, when: (s, st, o, d) => d === 4, line: 'This storm is flattening everything. Nothing will grow today, whatever we do.' },
  { who: 'hollis', p: 2, when: (s, st, o, d) => d === 7, line: 'Frost on the leaves this morning. The fields are done for the year.' },
  { who: 'hollis', p: 2, when: (s, st, o, d) => d === 3, line: 'Good soaking rain. The crops are drinking it up.' },
  { who: 'hollis', p: 3, when: (s, st) => st.foodDays >= 6, line: 'Granary\'s full to the rafters. We could spare some for a feast, or sell it.' },
  { who: 'marta',  p: 8, when: (s, st) => st.harmony < 35, line: 'People are angry. I hear talk of leaving. Give them something, anything.' },
  { who: 'marta',  p: 5, when: (s, st, o) => o.work === 2, line: 'Working them this hard, chief? Backs are breaking, and the tax collector isn\'t making friends.' },
  { who: 'marta',  p: 4, when: (s, st, o) => o.table === 0, line: 'Lean rations make for short tempers.' },
  { who: 'marta',  p: 3, when: (s, st) => st.harmony >= 75, line: 'I haven\'t seen this many smiles in years. Whatever you\'re doing, keep doing it.' },
  { who: 'rook',   p: 9, when: (s, st, o, d) => (d === 4 || d === 5) && st.power < 45 && (s.scoutedUntil >= 5 || d === 5), line: 'Those riders are real, and they\'re coming. We are not ready for them.' },
  { who: 'rook',   p: 6, when: (s, st, o, d) => d === 3 && s.scoutedUntil < 5, line: 'Hunters saw riders on the east ridge. I can\'t tell you how many without scouts.' },
  { who: 'rook',   p: 7, when: (s, st) => st.power < 25, line: 'Thieves walk right past my patrols. We\'re stretched too thin.' },
  { who: 'rook',   p: 4, when: (s, st, o) => o.guard === 0, line: 'No militia at all? Bold. I hope the valley stays friendly.' },
  { who: 'rook',   p: 2, when: (s, st) => st.power >= 60, line: 'The walls are manned and my people are sharp. Let them come.' },
  { who: 'pip',    p: 6, when: s => s.gold < 15, line: 'The treasury\'s nearly empty. One more bad day and wages go unpaid.' },

function focusOptions(s, day, orders) {
  const st = stats(s, orders || DEFAULT_ORDERS);
  const specials = (SCRIPT[day] && SCRIPT[day].specials) || [];
  return FOCUS.filter(f => {
    const isSpecial = f.kind === 'special' || f.special;
    if (isSpecial) return specials.includes(f.id);
    return !f.when || f.when(s);
  }).map(f => { const ok = f.ok ? f.ok(s, st) : true; return { f, ok: ok === true, why: ok === true ? '' : ok }; });
}

function newSettlement(orders) {
  const s = { ...SEASON.start, buildings: [], day: 1, scoutedUntil: 0, tools: false, well: false, met: {}, history: [] };
  s.score = stats(s, orders || DEFAULT_ORDERS).score; s.ranked = s.score;
  return s;
}
const cloneS = s => ({ ...s, buildings: s.buildings.slice(), history: s.history.slice(), met: { ...s.met } });

// ---------- Resolve one day ----------
// Returns story lines (log), number lines (ledger), and consequence lines (echo)
function resolveDay(s0, orders, focusId, rng) {
  const s = cloneS(s0), day = s.day, W = SCRIPT[day];
  const log = [], ledger = [], echo = [];
  const st0 = stats(s, orders);
  const c = { day, orders, rng, log, prices: W.prices, weatherFood: WEATHER_FOOD[W.weather], toolBonus: s.tools ? 1.15 : 1, output: st0.output, eat: eatenPerDay(s, orders), tempPower: 0, raidAvoided: false, gambleWon: null };
  const before = { food: s.food, gold: s.gold, materials: s.materials, pop: s.pop, harmony: st0.harmony, power: st0.power, wealth: st0.wealth, score: st0.score, ranked: s.ranked, foodDays: st0.foodDays };

  // Daily flow for the Ledger: where every unit of each resource came from or went
  const res = () => ({ food: s.food, gold: s.gold, materials: s.materials, pop: s.pop });
  const flow = []; let snap = res();
  const row = (label, d) => { const r = { label, food: r0(d.food || 0), gold: r0(d.gold || 0), materials: r0(d.materials || 0), pop: r0(d.pop || 0) }; if (r.food || r.gold || r.materials || r.pop) flow.push(r); };
  const mark = label => { const now = res(); row(label, { food: now.food - snap.food, gold: now.gold - snap.gold, materials: now.materials - snap.materials, pop: now.pop - snap.pop }); snap = now; };

  // Choices that come back: the tinker you turned away on day 1
  if (day === 2 && !s.met.tinker) s.met.tinker = 'refused';

  // 1. The Focus
  const f = FOCUS_BY_ID[focusId];
  if (f) { f.apply(s, c); ledger.push(`Focus: ${f.name} (${f.fx}).`); mark('Focus: ' + f.name); }
  else log.push('No focus today. The settlement ran on standing orders.');

  // 2. Standing orders run everything else
  const work = ORDER_FX.work.output[orders.work] * c.output;
  const foodMade = r0((s.pop * 1.0 * work + (has(s, 'fields') ? 4 : 0) + (s.well ? 4 : 0)) * c.weatherFood * c.toolBonus);
  const matMade = r0((s.pop * 0.35 * work + (has(s, 'sawmill') ? 6 : 0)) * c.toolBonus);
  const taxGold = r0((s.pop * ORDER_FX.work.gold[orders.work] + (has(s, 'market') ? 6 : 0)) * c.output);
  const eaten = r0(eatenPerDay(s, orders));
  const upkeepGold = ORDER_FX.guard.gold[orders.guard], upkeepFood = ORDER_FX.guard.food[orders.guard];
  s.food += foodMade - eaten - upkeepFood; s.materials += matMade; s.gold += taxGold - upkeepGold;
  let newcomers = 0;
  if (orders.gates === 0 && st0.harmony >= 40) newcomers = 2;
  if (orders.gates === 1 && st0.harmony >= 55) newcomers = 1;
  s.pop += newcomers;
  row('Work and taxes', { food: foodMade, materials: matMade, gold: taxGold });
  row('Eating', { food: -eaten });
  row('Guard upkeep', { food: -upkeepFood, gold: -upkeepGold });
  row('Newcomers arriving', { pop: newcomers });
  snap = res();
  ledger.push(`Standing orders: +${foodMade} Food made, −${eaten} eaten, +${matMade} Materials, +${taxGold} Gold in taxes. Harmony ${st0.harmony} gave output ×${st0.output.toFixed(2)}.`);
  if (upkeepGold) ledger.push(`Militia upkeep: −${upkeepGold} Gold${upkeepFood ? `, −${upkeepFood} Food` : ''}.`);
  if (newcomers && !(day % 2)) log.push(['A couple of families arrived at the open gate, looking for work.', 'A newcomer drifted in and asked for work.', 'Word of your settlement is spreading. More people arrived.'].at((day >> 1) % 3));
  if (W.weather === 'storm') log.push('The storm flattened the fields. The farms made almost nothing today.');
  if (W.weather === 'frost') log.push('Frost on the fields this morning. Winter is close.');

  // 3. Consequences of earlier choices
  if (day === 5 && s.met.refugees) { c.tempPower += 10; echo.push('The families you took in on day 3 know these raiders. They showed Rook exactly where they would strike.'); ledger.push('Refugees\' warning: Power +10 for the raid.'); }
  if (day === 6 && s.met.tinker === 'hired') echo.push('The tinker from day 1 is riding with the caravan. He tells everyone you\'re honest, and the buyers pay you extra for it.');
  if (day === 6 && s.met.tinker === 'refused') echo.push('The tinker you turned away on day 1 is riding with the caravan. He hasn\'t forgotten, and the buyers drive a harder bargain with you.');
  if (day === 7 && s.met.travelers) { s.materials += 15; s.mood += 6; echo.push('The merchant family you sheltered in the storm came back with a cart of firewood, just in time for the cold.'); ledger.push('Travelers\' gift: +15 Materials, Harmony +6.'); }

  mark('Earlier choices paying off');
  // 4. Power protects your stores
  const stNow = stats(s, orders), defense = stNow.power + c.tempPower;
  if (W.event === 'raid' && !c.raidAvoided) {
    const need = r0(W.raid * ORDER_FX.gates.raid[orders.gates]);
    if (defense >= need) { s.mood += 8; s.training -= 5; log.push('The raiders hit the gates at dusk and broke against them. People cheered from the walls.'); }
    else {
      const frac = Math.min(0.5, (need - defense) / need + 0.15);
      const g = r0(s.gold * frac), m = r0(s.materials * frac);
      s.gold -= g; s.materials -= m; s.mood -= 10;
      log.push(frac > 0.35 ? 'The raiders broke through and ransacked the storehouses. It will take a while to recover.' : 'The raiders got over the wall and grabbed what they could before you drove them off.');
    }
    ledger.push(`Raid: your Power ${defense} vs their ${need}${defense >= need ? ' (held)' : ' (broke through)'}.`);
  } else if (defense < 25 && s.gold > 0) {
    const g = r0(s.gold * 0.1); s.gold -= g;
    if (g) { log.push('Thieves slipped past the thin patrols and lifted some coin.'); ledger.push(`Thieves (Power under 25): −${g} Gold.`); }
  }
  if (W.event === 'winter') {
    if (s.food >= s.pop * 2) { s.mood += 10; log.push('The first winter night came, and the granary was full. Everyone ate well and slept warm.'); }
    else { s.mood -= 10; log.push('The first winter night came, and the granary ran thin. People went to bed hungry.'); }
    ledger.push(`Winter night: needed ${s.pop * 2} Food in store.`);
  }

  mark(W.event === 'raid' ? 'The raid' : 'Thieves');
  // 5. Hard times (never a game over)
  if (s.food < 0) { const lost = Math.max(0, Math.min(s.pop - 4, Math.ceil(-s.food / 4))); s.pop -= lost; row('Hunger: settlers left', { pop: -lost }); s.mood -= 10; s.food = 0; log.push(lost ? `The food ran out. ${lost === 1 ? 'A settler' : lost + ' settlers'} left to find a fuller table elsewhere.` : 'The food ran out. People are frightened.'); }
  if (s.gold < 0) { s.gold = 0; s.mood -= 6; log.push('The treasury ran dry and wages went unpaid. People noticed.'); }
  s.pop = Math.max(4, s.pop);
  s.food = r0(s.food); s.gold = r0(s.gold); s.materials = Math.max(0, r0(s.materials));
  if (!log.length) log.push('A quiet day.');

  // 6. Recent events and training fade
  s.mood = r0(s.mood * 0.7); s.training = Math.max(0, r0(s.training * 0.8));

  // 7. Score, with the daily swing cap on the ranked score
  const st1 = stats(s, orders);
  s.score = st1.score;
  s.ranked = r0(clamp(s.score, before.ranked * 0.75, before.ranked * 1.35));
  s.history.push({ day, focus: focusId, ranked: s.ranked, gambleWon: c.gambleWon });
  s.day = day + 1;
  const net = { food: s.food - before.food, gold: s.gold - before.gold, materials: s.materials - before.materials, pop: s.pop - before.pop };
  return { s, log, ledger, echo, flow, net, before, after: { food: s.food, gold: s.gold, materials: s.materials, pop: s.pop, harmony: st1.harmony, power: st1.power, wealth: st1.wealth, foodDays: st1.foodDays }, gambleWon: c.gambleWon };
}

// ---------- The simulated crowd ----------
const BOT_FIRST = ['Ash', 'Bram', 'Cora', 'Dell', 'Edda', 'Finn', 'Greta', 'Hale', 'Ines', 'Jory', 'Kit', 'Lark', 'Moss', 'Nell', 'Orrin', 'Pip', 'Quill', 'Rue', 'Sable', 'Tamsin', 'Ulla', 'Vale', 'Wren', 'Yara'];
const BOT_PLACE = ['hollow', 'ford', 'stead', 'wick', 'mere', 'ridge', 'haven', 'brook', 'fell', 'gate'];
function makeCrowd(n, seed) {
  const rng = mulberry32(seed);
  const pick = a => a[Math.floor(rng() * a.length)];
  return Array.from({ length: n }, (_, i) => {
    const o = {};
    DIALS.forEach(d => { const x = rng(); o[d.id] = x < 0.2 ? 0 : x < 0.8 ? 1 : 2; });
    return { name: pick(BOT_FIRST) + "'s " + pick(BOT_FIRST).toLowerCase().slice(0, 3) + pick(BOT_PLACE), orders: o, s: newSettlement(o), rng: mulberry32(seed * 31 + i * 977), skill: rng() };
  });
}
function botChoose(bot) {
  const opts = focusOptions(bot.s, bot.s.day, bot.orders).filter(x => x.ok);
  const w = opts.map(({ f }) => {
    let v = 1;
    if (f.kind === 'special' || f.special) v += 1.5 * bot.skill + 0.5;
    if (f.kind === 'build') v += 1.2 * bot.skill;
    if (f.kind === 'gamble') v += 0.4;
    if (f.id === 'scout' && bot.s.day <= 4) v += bot.skill;
    if (f.id === 'drill' && bot.s.day === 4) v += 2 * bot.skill;
    return v;
  });
  let x = bot.rng() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < opts.length; i++) { x -= w.at(i); if (x <= 0) return opts.at(i).f.id; }
  return opts.length ? opts.at(-1).f.id : null;
}
function stepCrowd(crowd) {
  const picks = {};
  crowd.forEach(b => {
    const id = botChoose(b);
    const before = stats(b.s, b.orders).lasting;
    const r = resolveDay(b.s, b.orders, id, b.rng);
    b.s = r.s;
    (picks[id] = picks[id] || { n: 0, gain: 0 }).n++;
    picks[id].gain += (stats(b.s, b.orders).lasting - before) / Math.max(1, before);
  });
  return picks;
}



// ---------- The best move ----------
// Tries every available Focus from the village's real state, plays the rest of the season out
// several times, and ranks the options by where the village ends up. Same seeds for every option,
// so differences come from the choice, not luck.
function evaluateDay(s, orders, rollouts = 12) {
  const opts = focusOptions(s, s.day, orders).filter(x => x.ok).map(x => x.f.id);
  const pickRandom = (t, r) => { const o = focusOptions(t, t.day, orders).filter(x => x.ok); return o.length ? o[Math.floor(r() * o.length)].f.id : null; };
  const value = {};
  for (const id of opts) {
    let tot = 0;
    for (let k = 0; k < rollouts; k++) {
      const r = mulberry32(s.day * 7919 + k * 104729 + 17);
      let t = resolveDay(s, orders, id, r).s;
      while (t.day <= SEASON.days) t = resolveDay(t, orders, pickRandom(t, r), r).s;
      tot += t.score;
    }
    value[id] = tot / rollouts;
  }
  const ranked = Object.entries(value).sort((a, b) => b[1] - a[1]);
  return { value, ranked, best: ranked.length ? ranked[0][0] : null, bestValue: ranked.length ? ranked[0][1] : 0 };
}
// 'best' = the top choice or within 2% of it, 'solid' = within 10%, 'weak' = below that
function gradePick(ev, id) {
  const v = ev.value[id];
  if (v == null || !ev.bestValue) return 'weak';
  const ratio = v / ev.bestValue;
  return ratio >= 0.98 ? 'best' : ratio >= 0.9 ? 'solid' : 'weak';
}

// Render an icon as a crisp SVG; mono=true draws it as a faded ink outline (for empty meters)
function icon(name, size = 24, opts = {}) {
  const rows = BITMAPS[name] || BITMAPS.fog, w = Math.max(...rows.map(r => r.length)), h = rows.length;
  let rects = '';
  rows.forEach((row, y) => {
    let x = 0;
    while (x < row.length) {
      const ch = row[x]; if (ch === '.' || !IPAL[ch]) { x++; continue; }
      let e = x; while (e < row.length && row[e] === ch) e++;
      const fill = opts.mono ? (ch === 'k' ? '#9c8463' : '#e3d2ab') : IPAL[ch];
      rects += `<rect x="${x}" y="${y}" width="${e - x}" height="1" fill="${fill}"/>`;
      x = e;
    }
  });
  const pw = Math.max(w, h);
  return `<svg class="px${opts.cls ? ' ' + opts.cls : ''}" width="${size}" height="${size}" viewBox="${-(pw - w) / 2} ${-(pw - h) / 2} ${pw} ${pw}" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
}

function canvasIcon(name, x, y, alpha = 1) {
  const rows = BITMAPS[name]; if (!rows) return;

  rows.forEach((row, ry) => { for (let rx = 0; rx < row.length; rx++) { const c = IPAL[row[rx]]; if (c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x + rx), Math.round(y + ry), 1, 1); } } });

}

function ledgerHistory() {
  const H = Object.values(G.hist);

  const W = 600, Ht = 180, L = 44, Rm = 16, T0 = 16, B = 26;

  const step = maxV > 800 ? 200 : maxV > 400 ? 100 : 50, top = Math.ceil(maxV / step) * step;
  const X = d => L + d / days * (W - L - Rm), Y = v => T0 + (1 - v / top) * (Ht - T0 - B);
  const pts = arr => arr.map(([d, v]) => `${X(d).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const you = [[0, H[0].prev], ...H.map(h => [h.day, h.ranked])], med = [[0, H[0].medianStart], ...H.map(h => [h.day, h.median])];
  const grid = Array.from({ length: top / step + 1 }, (_, i) => i * step).map(v => `<line x1="${L}" x2="${W - Rm}" y1="${Y(v)}" y2="${Y(v)}" class="g"/><text x="${L - 6}" y="${Y(v) + 4}" class="ax" text-anchor="end">${v}</text>`).join('');

  const endY = you.at(-1)[0] > days - 2;

    ${you.map(([d, v]) => `<circle cx="${X(d)}" cy="${Y(v)}" r="3.5" class="dyou"/>`).join('')}

let busy = false;
function endDay() {
  if (!G.choice || busy) return;
  const day = G.s.day;
  const ev = evaluateDay(G.s, G.orders);
  G.grades[day] = { grade: gradePick(ev, G.choice), best: ev.best, runnerUp: ev.ranked.length > 1 ? ev.ranked[1][0] : null };
  const r = resolveDay(G.s, G.orders, G.choice, G.playerRng);
  const medianOf = () => { const v = G.crowd.map(b => b.s.ranked).sort((x, y) => x - y); return v[Math.floor(v.length / 2)]; };
  const medianStart = medianOf();
  G.picksByDay[day] = stepCrowd(G.crowd);
  G.hist[day] = { day, focus: G.choice, grade: G.grades[day].grade, prev: r.before.ranked, ranked: r.s.ranked, median: medianOf(), medianStart: day === 1 ? medianStart : (G.hist[day - 1] || {}).median };
  G.results.push({ day, flow: r.flow, net: r.net });
  G.s = r.s;
  G.morning = { ...G.orders };
  const picked = G.choice;
  busy = true; closeNote(); hideBubble();
  document.body.classList.add('dusk');
  $('endHint').textContent = 'Night falls…';
  retarget(true);
  const b = r.before, a = r.after;
  const ch = [['heart', a.harmony - b.harmony], ['shield', a.power - b.power], ['pouch', a.wealth - b.wealth], ['sack', a.foodDays - b.foodDays]].filter(([, v]) => Math.abs(v) >= 1);
  puffs = ch.map(([ic, v], i) => ({ icon: ic, up: v > 0, dx: (i - (ch.length - 1) / 2) * 24, born: lastT + .5 + i * .3 }));
  nightTarget = 1;
  if (reduceMotion) { night = 1; paint(0); showResults(day, picked, r); }
  else setTimeout(() => showResults(day, picked, r), 2300);
}

  $('overlay').hidden = true;

  const story = r.log.slice(1, 3).concat(ordersLine);
  $('sheet').innerHTML = `
    <header class="mast"><h3 id="sheetTitle">${sea ? 'The Harbor Chronicle' : 'The Valley Chronicle'}</h3><p><span>${last ? 'Final edition' : 'Evening edition'} · day ${day} of ${SEASON.days}</span><span>${WEATHER_WORD[SCRIPT[day].weather]}</span></p></header>
    <p class="lead">${esc(T(r.log[0] || 'A quiet day.'))}</p>
    <div class="story${story.join(' ').length > 260 ? ' cols' : ''}">${story.map(l => `<p>${esc(T(l))}</p>`).join('')}</div>
    ${r.echo.map(e => `<p class="echo"><b>Your past catches up</b>${esc(T(e))}</p>`).join('')}
    <div class="ccols">
      <div style="display:grid;gap:12px;align-content:start">
        <section class="box"><h4>Best move for your village</h4><div class="bm"><span class="grade ${gd.grade}" aria-label="${gd.grade}"></span><div><p><b>${esc(focusName(bf))}</b>. ${pctBest <= 1 ? 'Almost nobody' : pctBest + '% of villages'} chose it.</p><p class="you">${verdict}${gd.grade !== 'best' ? ` You picked ${esc(focusName(FOCUS_BY_ID[picked]))}.` : ''}</p></div></div></section>
        <section class="box"><h4>How the village feels tonight</h4>
          <div class="shifts">${moodShift('heart', T('Harmony'), MOODS.harmony, b.harmony, a.harmony)}${moodShift('shield', T('Power'), MOODS.power, b.power, a.power)}${moodShift('pouch', T('Wealth'), MOODS.wealth, b.wealth, a.wealth)}${moodShift('sack', R.food, MOODS.food, b.foodDays, a.foodDays)}</div>
          <div class="counts">${count('coin', R.gold, b.gold, a.gold)}${count('log', R.materials, b.materials, a.materials)}${count('person', R.pop, b.pop, a.pop) || ''}</div></section>
      </div>
      <section class="box"><h4>What everyone else did</h4><div class="crowd">${crowdHtml}</div><p class="you" style="font-size:.85rem;color:var(--ink-soft);font-style:italic">▲ mostly paid off · ▼ mostly hurt</p></section>
    </div>
    <div class="rankline"><span>Score <b>${fmt(b.ranked)} → ${fmt(s.ranked)}</b> (${myGain >= 0 ? '+' : ''}${(myGain * 100).toFixed(0)}%)</span><span>Rank <b>#${ri.rank}</b> of ${ri.total} · top ${ri.top}%</span></div>
    <details class="mini"><summary>Today's numbers</summary><ul>${r.ledger.map(l => `<li>${esc(T(l))}</li>`).join('')}<li>${esc(T('Harmony'))} ${b.harmony} → ${a.harmony}, ${esc(T('Power'))} ${b.power} → ${a.power}, ${esc(T('Wealth'))} ${b.wealth} → ${a.wealth}</li></ul></details>
    ${last ? seasonSummary() : `<button class="morning" id="nextDay">${icon('sun', 24)}Morning</button>`}`;
  $('overlay').hidden = false;
  $('overlay').scrollTop = 0;
  if (last) wireSummary(); else $('nextDay').onclick = morning;
  ($('nextDay') || $('copyShare')).focus({ preventScroll: true });
}
function seasonSummary() {
  const s = G.s, ri = rankInfo(s), st = stats(s, G.orders);
  const side = fn => 1 + G.crowd.filter(b => fn(stats(b.s, b.orders)) > fn(st)).length;
  const lb = [...G.crowd.map(b => ({ name: b.name, v: b.s.ranked })), { name: 'You', v: s.ranked, me: true }].sort((x, y) => y.v - x.v);
  const myIdx = lb.findIndex(x => x.me);
  const shown = lb.slice(0, 5).concat(myIdx >= 5 ? [lb.at(myIdx)] : []);
  const counts = { best: 0, solid: 0, weak: 0 };
  Object.values(G.grades).forEach(g => counts[g.grade]++);
  return `<section class="box seasongrid"><h4>Your season</h4><span class="sq">${gridHtml()}</span><p>${counts.best} best move${counts.best === 1 ? '' : 's'} · ${counts.solid} good · ${counts.weak} missed</p></section>
    <section class="box"><h4>Final standings</h4>
    <table class="lb">${shown.map((x, i) => `<tr class="${x.me ? 'me' : ''}"><td>#${x.me ? myIdx + 1 : i + 1}</td><td>${esc(x.name)}</td><td>${fmt(x.v)}</td></tr>`).join('')}</table></section>
    <div class="rankline"><span>Richest <b>#${side(x => x.wealth)}</b></span><span>Happiest <b>#${side(x => x.harmony)}</b></span><span>Strongest <b>#${side(x => x.power)}</b></span></div>
    <pre class="share" id="share">Thirty Days · ${TH().season.split(' · ')[1]} · prototype
Score ${fmt(s.ranked)} · top ${ri.top}%
${gridLine()}  ${counts.best}/${SEASON.days} best moves
🏘 ${T(MOODS.harmony(st.harmony))} · ${T(MOODS.power(st.power))} · ${T(MOODS.wealth(st.wealth))}</pre>
    <div class="row2"><button class="morning" id="copyShare">Copy result</button><button class="plain" id="again">Play the week again</button></div>
    <p class="fine">The real game runs 30 days, against everyone playing that month.</p>`;
}
function wireSummary() {
  $('copyShare').onclick = async e => {
    const btn = e.currentTarget, txt = $('share').textContent;
    try { await navigator.clipboard.writeText(txt); btn.textContent = 'Copied'; }
    catch { const rg = document.createRange(); rg.selectNodeContents($('share')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg); btn.textContent = 'Selected, copy it'; }
  };
  $('again').onclick = () => { morning(); newGame(G.seed + 1); };
}

// ---------------------------------------------------------------------------
// How to play: a short tour that rings the real pieces of the screen
// ---------------------------------------------------------------------------
const TOUR = [
  { title: 'Welcome, chief', text: 'You lead a small frontier village for thirty days (this prototype is one week). Each day you make one big choice. At the end, your village is ranked against everyone else\'s.', start: true },
  { target: ['moods', 'res'], title: 'How your village is doing', text: 'The heart is Harmony, the shield is Power, the pouch is Wealth and the sack is Food. The fuller the icon, the better. Your score multiplies the first three, so one weak spot drags everything down. Tap an icon to see why.' },
  { target: ['almanac'], title: 'The almanac', text: 'What\'s coming this week. Tap a day to read it. "sure" means it will happen; a ? is only a rumor. Scouting fills in more days.' },
  { target: ['stage'], title: 'Your village', text: 'Tap anyone to hear what they have to say. Council members with a ! over their head have news for you today. Their hints and the almanac point to the best move.' },
  { target: ['cards'], title: 'Pick one Focus', text: 'This is the day\'s big decision. Tap a card to read it. Cards with a red ribbon are only here today. Cards with a die are gambles, with the odds shown.' },
  { target: ['orders'], title: 'Your standing orders', text: 'These four levers run everything you don\'t focus on: how hard people work, how well they eat, who gets through the gates, and how strong your guard is. Set them and leave them, or change them when things change.' },
  { target: ['endDay'], title: 'Seal the day', text: 'Night falls and the village acts it out. Then the Chronicle tells you what happened, how everyone else chose, and whether you found the best move. Try to fill your season with green squares.' },
  { target: ['ledgerBtn'], title: 'The ledger book', text: 'Every number behind the story lives in here, whenever you want it.', last: true },
];
let tourAt = -1;
function showTour(i) {
  tourAt = i; closeNote();
  const st = TOUR[i], card = $('tourCard'), ring = $('tourRing');
  $('tourBlock').hidden = false; card.hidden = false; ring.hidden = false;
  $('tourStep').textContent = st.start ? 'How to play · 30 seconds' : `Step ${i} of ${TOUR.length - 1}`;
  $('tourTitle').textContent = T(st.title);
  $('tourText').textContent = T(st.text);
  $('tourDots').innerHTML = TOUR.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('');
  $('tourBack').hidden = i === 0;
  $('tourNext').textContent = st.start ? 'Show me' : st.last ? 'Start playing' : 'Next';
  $('tourSkip').textContent = st.start ? 'Skip, I\'ll figure it out' : 'Skip';
  card.className = 'tour-card';
  if (!st.target) { ring.className = 'tour-ring full'; ring.removeAttribute('style'); card.classList.add('center'); }
  else {
    const els = st.target.map(id => $(id)).filter(Boolean);
    if (els[0] !== $('stage')) els[0].scrollIntoView({ block: 'center', behavior: 'auto' }); else window.scrollTo({ top: 0 });
    ring.className = 'tour-ring';
    const place = () => {
      if (tourAt !== i) return;
      const rs = els.map(e => e.getBoundingClientRect()), pad = 5;
      const l = Math.max(2, Math.min(...rs.map(r => r.left)) - pad), t = Math.max(2, Math.min(...rs.map(r => r.top)) - pad);
      const rr = Math.min(innerWidth - 2, Math.max(...rs.map(r => r.right)) + pad), b = Math.min(innerHeight - 2, Math.max(...rs.map(r => r.bottom)) + pad);
      Object.assign(ring.style, { left: l + 'px', top: t + 'px', width: (rr - l) + 'px', height: (b - t) + 'px' });
      card.classList.remove('at-top', 'at-bottom');
      card.classList.add(b - t > innerHeight * .55 ? 'at-bottom' : (t + b) / 2 < innerHeight / 2 ? 'at-bottom' : 'at-top');
    };
    place(); requestAnimationFrame(place); setTimeout(place, 150);
  }
  $('tourNext').focus({ preventScroll: true });
}
function endTour() {
  tourAt = -1;
  $('tourBlock').hidden = true; $('tourCard').hidden = true; $('tourRing').hidden = true;
  try { localStorage.setItem('thirtydays-tour-seen', '1'); } catch (e) { /* storage unavailable */ }
  window.scrollTo({ top: 0 }); $('panel').scrollTop = 0;
}
$('tourNext').onclick = () => tourAt >= TOUR.length - 1 ? endTour() : showTour(tourAt + 1);
$('tourBack').onclick = () => showTour(Math.max(0, tourAt - 1));
$('tourSkip').onclick = endTour;

// ---------------------------------------------------------------------------
// Wiring
// ---------------------------------------------------------------------------
$('endDay').onclick = endDay;
$('ledgerBtn').innerHTML = icon('book', 26);
$('wax').innerHTML = icon('moon', 28);
$('ledgerBtn').onclick = openLedger;
$('ledgerClose').onclick = closeLedger;
$('ledger').addEventListener('click', e => { if (e.target === $('ledger') || e.target.classList.contains('book-wrap')) closeLedger(); });
$('howTo').onclick = () => { if ($('overlay').hidden && !busy) { if (!$('ledger').hidden) closeLedger(); showTour(0); } };
['frontier', 'fleet'].forEach(t => $('th-' + t).onclick = () => { theme = t; $('th-frontier').setAttribute('aria-pressed', t === 'frontier'); $('th-fleet').setAttribute('aria-pressed', t === 'fleet'); render(); });
document.addEventListener('keydown', e => {
  if (tourAt >= 0) {
    if (e.key === 'Escape') { e.preventDefault(); endTour(); }
    if (e.key === 'ArrowRight') $('tourNext').click();
    if (e.key === 'ArrowLeft' && tourAt > 0) $('tourBack').click();
    return;
  }
  if (e.key !== 'Escape') return;
  if (!$('ledger').hidden) closeLedger();
  else if (!$('overlay').hidden && $('nextDay')) $('nextDay').click();
  else { closeNote(); hideBubble(); }
});
// On phones the theme switch moves from the village to the bottom of the board to leave room
const themesEl = document.querySelector('.themes');
function placeThemes() { const phone = innerWidth < 900; if (phone && themesEl.parentElement !== $('panel')) $('panel').appendChild(themesEl); else if (!phone && themesEl.parentElement === $('panel')) document.querySelector('.tools').prepend(themesEl); }
placeThemes();
window.addEventListener('resize', () => { placeThemes(); fitCanvas(); closeNote(); if (tourAt >= 0) showTour(tourAt); });
let seenTour = false;
try { seenTour = localStorage.getItem('thirtydays-tour-seen') === '1'; } catch (e) { seenTour = false; }
newGame(20261023);
startDiorama();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitCanvas());
if (!seenTour) showTour(0);
</script>
